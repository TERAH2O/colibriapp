    DB.comus.forEach(c=>{
      const card=el('div',{cls:'card'});
      card.appendChild(div({display:'flex',gap:'14px'},
        div({width:'42px',height:'42px',borderRadius:'12px',background:'#EDE9FE',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0},c.tipo==='evento'?'🎉':c.tipo==='finanzas'?'💰':'📋'),
        div({flex:1},
          div({display:'flex',justifyContent:'space-between',marginBottom:'4px'},el('h4',{style:{margin:0,fontWeight:800}},c.titulo),span({fontSize:'12px',color:'#6B7280'},c.fecha)),
          p({margin:'0 0 8px',color:'#6B7280',fontSize:'13px'},c.cuerpo),
          badge('👁 '+c.leidos+' leídos','#06B6D4')
        )
      ));
      main.appendChild(card);
    });
  }
  function openModal(){
    let f={titulo:'',cuerpo:'',sid:'all',tipo:'info'};
    const {close}=modal([
      el('h3',{style:{margin:'0 0 18px',fontWeight:800}},'Nuevo comunicado'),
      fgrp('Título',inpEl(f.titulo,'',v=>f.titulo=v)),
      fgrp('Mensaje',txaEl(f.cuerpo,'',v=>f.cuerpo=v,4)),
      fgrp('Para',selEl(f.sid,[['all','Todas las salas'],...DB.salas.map(s=>[s.id,s.emo+' '+s.nom])],v=>f.sid=v)),
      fgrp('Tipo',selEl(f.tipo,[['info','Información'],['evento','Evento'],['finanzas','Finanzas']],v=>f.tipo=v)),
      div({display:'flex',gap:'10px'},
        btn('Enviar 🚀','btn-pri',()=>{if(!f.titulo||!f.cuerpo)return;DB.comus.unshift({id:uid(),titulo:f.titulo,cuerpo:f.cuerpo,sid:f.sid,tipo:f.tipo,fecha:fmt(new Date()),leidos:0});saveDB();close();draw();}),
        btn('Cancelar','btn-light',()=>close())
      )
    ],()=>close());
  }
  draw();
}

// ═══ MAESTRA NAV ═════════════════════════════════════════
function getMaeNav(){
  const u=USER;
  const mtr=DB.maestras.find(m=>m.id===u.mid);
  const sala=mtr?DB.salas.find(s=>s.id===mtr.sid):null;
  return [
    {ico:'🏠',lbl:'Mi sala',render:m=>maeHome(m,sala,mtr)},
    {ico:'👶',lbl:'Mis niños',render:m=>maeNinos(m,sala)},
    {ico:'📋',lbl:'Asistencia',render:m=>maeAsist(m,sala)},
    {ico:'📝',lbl:'Evaluaciones',render:m=>maeEvals(m,sala)},
    {ico:'📷',lbl:'Galería Fotos',render:m=>{m.appendChild(shdr('Galería Fotos',sala?sala.nom:''));if(sala)m.appendChild(galeriaComponent(sala,false));}},
    {ico:'📅',lbl:'Planificación',render:m=>maeCalend(m,sala)},
    {ico:'📣',lbl:'Comunicados',render:m=>maeComus(m,sala)},
    {ico:'📄',lbl:'Reportes',render:m=>maeReportes(m,sala)}
  ];
}

function maeHome(main,sala,mtr){
  if(!sala){main.appendChild(p({padding:'20px'},'Sin sala asignada.'));return;}
  const ninos=ninosActivos(sala.id);
  const pres=ninos.filter(n=>n.asis[fmt(HOY)]==='P').length;
  main.appendChild(shdr(sala.emo+' '+sala.nom,'Hola '+(mtr?mtr.nom.split(' ')[0]:'')+'  ·  '+new Date().toLocaleDateString('es-EC',{weekday:'long',day:'numeric',month:'long'})));
  const g=el('div',{cls:'g3',style:{marginBottom:'18px'}});
  [['Niños',ninos.length,'👶','#7C3AED','#EDE9FE'],['Presentes hoy',pres,'✅','#10B981','#D1FAE5'],['Ausentes',ninos.length-pres,'❌','#EF4444','#FEE2E2']].forEach(([l,v,i,c,bg])=>g.appendChild(statCard(l,v,i,c,bg)));
  main.appendChild(g);
  main.appendChild(cardCumplesHoy());
  const c=el('div',{cls:'card'});
  c.appendChild(el('h3',{style:{margin:'0 0 14px',fontWeight:800}},'Niños de la sala'));
  const ng=el('div',{cls:'g3'});
  ninos.forEach(n=>{
    const est=n.asis[fmt(HOY)];
    const d=div({background:'#F4F1FF',borderRadius:'12px',padding:'14px',cursor:'pointer',display:'flex',gap:'10px',alignItems:'center'});
    d.appendChild(aEl(n.ava,n.foto,40));
    d.appendChild(div(null,p({margin:0,fontWeight:700,fontSize:'13px'},n.nom.split(' ')[0]),est?badge(AL[est],AC[est]):null));
    d.addEventListener('click',()=>openFicha(n));
    ng.appendChild(d);
  });
  c.appendChild(ng);
  main.appendChild(c);
}

  if(!sala)return;
  const ninos=ninosActivos(sala.id);
  main.appendChild(shdr('Lista de niños',ninos.length+' en '+sala.nom));
  const g=el('div',{cls:'g3'});
  ninos.forEach(n=>{
    const c=el('div',{cls:'card',style:{padding:'16px'}});
    c.appendChild(div({display:'flex',gap:'12px',alignItems:'center',marginBottom:'12px'},aEl(n.ava,n.foto,50),div(null,p({margin:0,fontWeight:800,fontSize:'15px'},n.nom),p({margin:0,fontSize:'12px',color:'#6B7280'},n.tutor))));
    if(n.alerg!=='Ninguna') c.appendChild(div({background:'#FEE2E2',borderRadius:'8px',padding:'6px 10px',marginBottom:'10px'},p({margin:0,fontSize:'12px',color:'#EF4444'},'⚠️ '+n.alerg)));
    c.appendChild(btn('Ver ficha','btn-sm btn-light',()=>openFicha(n)));
    g.appendChild(c);
  });
  main.appendChild(g);
}

function maeAsist(main,sala){
  if(!sala)return;
  const ninos=ninosActivos(sala.id);
  let fSel=fmt(HOY);
  function draw(){
    main.innerHTML='';
    const ct={P:ninos.filter(n=>n.asis[fSel]==='P').length,A:ninos.filter(n=>n.asis[fSel]==='A').length,T:ninos.filter(n=>n.asis[fSel]==='T').length};

    main.appendChild(shdr('Control de asistencia',(fSel===fmt(HOY)?'Hoy · ':'Editando · ')+fLbl));

function verHistAsist(sala){
  const histSala=(DB.historialAsistencia||[]).filter(h=>h.salaId===sala.id).slice().reverse();
  const {close}=modal([
    el('h3',{style:{margin:'0 0 4px',fontWeight:900}},'Historial de asistencia'),

    !histSala.length?p({color:'#6B7280',fontSize:'13px',textAlign:'center',padding:'20px'},'Sin registros aún.'):

      ...histSala.map(h=>{
        const d=div({padding:'10px 0',borderBottom:'1px solid #E5E7EB'});

          el('span',{style:{background:'#FEE2E2',color:'#DC2626',borderRadius:'8px',padding:'3px 10px',fontSize:'12px',fontWeight:700}},'❌ '+h.ausentes),
          el('span',{style:{background:'#FEF3C7',color:'#D97706',borderRadius:'8px',padding:'3px 10px',fontSize:'12px',fontWeight:700}},'⏰ '+h.tardanzas)
        ));
        return d;
      })
    ),
    div({marginTop:'14px',display:'flex',gap:'8px'},
      btn('📥 Exportar CSV','btn-sm',()=>exportAsistCSV(sala,histSala)),
      btn('Cerrar','btn-light',()=>close())

function exportAsistCSV(sala, histSala){
  let csv='Fecha,Dia,Presentes,Ausentes,Atrasos,Hora registro\n';
  histSala.forEach(function(h){
    var dia=new Date(h.fecha+'T12:00:00').toLocaleDateString('es-EC',{weekday:'long'});
    csv+=h.fecha+','+dia+','+h.presentes+','+h.ausentes+','+h.tardanzas+','+h.hora+'\n';
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='Asistencia_'+sala.nom.replace(/ /g,'_')+'_'+fmt(new Date())+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function asistMesCard(ninos,color){
  var MESES_AM=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var mIdxA=new Date().getMonth(), anioA=new Date().getFullYear();
  var wrap=el('div',{cls:'card',style:{marginTop:'18px'}});
  function redraw(){
    wrap.innerHTML='';
    var head=div({display:'flex',gap:'10px',alignItems:'center',marginBottom:'14px',flexWrap:'wrap'});
    head.appendChild(el('h3',{style:{margin:0,fontWeight:800,flex:1,fontSize:'15px'}},'📅 Asistencia del mes'));
    head.appendChild(btn('◀','',function(){mIdxA--;if(mIdxA<0){mIdxA=11;anioA--;}redraw();},{background:'#E5E7EB',border:'none',borderRadius:'8px',padding:'6px 12px',fontSize:'14px'}));
    head.appendChild(p({margin:0,fontWeight:800,fontSize:'14px',minWidth:'140px',textAlign:'center',color:color||'#7C3AED'},MESES_AM[mIdxA]+' '+anioA));
    head.appendChild(btn('▶','',function(){mIdxA++;if(mIdxA>11){mIdxA=0;anioA++;}redraw();},{background:'#E5E7EB',border:'none',borderRadius:'8px',padding:'6px 12px',fontSize:'14px'}));
    wrap.appendChild(head);
    var diasMes=new Date(anioA,mIdxA+1,0).getDate();
    var scroll=div({overflowX:'auto'});
    var t=el('table',{style:{borderCollapse:'collapse',fontSize:'11px',minWidth:'100%'}});
    var thr=el('tr');
    thr.appendChild(el('th',{style:{textAlign:'left',padding:'6px 8px',background:'#1E1B4B',color:'#fff',minWidth:'120px',fontSize:'11px',borderRadius:'8px 0 0 0'}},'Niño/a'));
    var d,dow;
    for(d=1;d<=diasMes;d++){
      dow=new Date(anioA,mIdxA,d).getDay();
      thr.appendChild(el('th',{style:{padding:'6px 3px',background:(dow===0||dow===6)?'#374151':'#1E1B4B',color:(dow===0||dow===6)?'rgba(255,255,255,.35)':'#fff',minWidth:'22px',textAlign:'center',fontSize:'10px'}},String(d)));
    }
    [['P','#10B981'],['A','#EF4444'],['T','#F59E0B'],['%','#7C3AED']].forEach(function(h){
      thr.appendChild(el('th',{style:{padding:'6px 5px',background:h[1],color:'#fff',minWidth:'28px',textAlign:'center',fontSize:'10px'}},h[0]));
    });
    t.appendChild(thr);
    ninos.forEach(function(n,ri){
      var tr=el('tr',{style:{background:ri%2===0?'#fff':'#FAFAFA'}});
      tr.appendChild(el('td',{style:{padding:'5px 8px',fontWeight:700,fontSize:'11px',borderBottom:'1px solid #E5E7EB',whiteSpace:'nowrap'}},n.nom));
      var cP=0,cA=0,cT=0;
      for(d=1;d<=diasMes;d++){
        dow=new Date(anioA,mIdxA,d).getDay();
        var clave=anioA+'-'+String(mIdxA+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        var est=n.asis[clave]||'';
        if(est==='P')cP++;if(est==='A')cA++;if(est==='T')cT++;
        var bg=est==='P'?'#D1FAE5':est==='A'?'#FEE2E2':est==='T'?'#FEF3C7':(dow===0||dow===6)?'#F3F4F6':'#fff';
        var cc=est==='P'?'#059669':est==='A'?'#DC2626':est==='T'?'#D97706':'#D1D5DB';
        tr.appendChild(el('td',{style:{padding:'5px 2px',textAlign:'center',fontWeight:800,fontSize:'10px',background:bg,color:cc,borderBottom:'1px solid #E5E7EB'}},est||'·'));
      }
      var tot=cP+cA+cT;
      var pct=tot?Math.round(cP/tot*100):0;
      [[cP,'#059669','#D1FAE5'],[cA,'#DC2626','#FEE2E2'],[cT,'#D97706','#FEF3C7'],[pct+'%','#7C3AED','#EDE9FE']].forEach(function(s){
        tr.appendChild(el('td',{style:{padding:'5px 3px',textAlign:'center',fontWeight:900,fontSize:'10px',background:s[2],color:s[1],borderBottom:'1px solid #E5E7EB'}},String(s[0])));
      });
      t.appendChild(tr);
    });
    scroll.appendChild(t);
    wrap.appendChild(scroll);
    wrap.appendChild(p({margin:'10px 0 0',fontSize:'11px',color:'#6B7280'},'P = Presente · A = Ausente · T = Atraso · Los fines de semana se muestran en gris.'));
  }
  redraw();
  return wrap;
}

function maeCalend(main,sala){
  if(!sala)return;
  const TODOS_DIAS=['lunes','martes','miercoles','jueves','viernes'];
  const diasSala=(sala.diasClase&&sala.diasClase.length)?sala.diasClase:TODOS_DIAS;
  const MESES_LECTIVOS=['Septiembre 2026','Octubre 2026','Noviembre 2026','Diciembre 2026','Enero 2027','Febrero 2027','Marzo 2027','Abril 2027','Mayo 2027','Junio 2027','Julio 2027'];
  let guardando=false, editId=null;
  function makePlan(){ return {mes:MESES_LECTIVOS[0],fi:'',ff:'',proyecto:'',adapta:'',dias:Object.fromEntries(TODOS_DIAS.map(d=>[d,'']))}; }
  let f=makePlan();
  function rangoTxt(fi,ff){
    if(!fi||!ff)return '';
    const a=new Date(fi+'T12:00:00'),b=new Date(ff+'T12:00:00');
    const o={day:'numeric',month:'short'};
    return a.toLocaleDateString('es-EC',o)+' — '+b.toLocaleDateString('es-EC',o);
  }

  function draw(){
    main.innerHTML='';
    const planes=(DB.planif||{})[sala.id]||[];
    const svcMap=Object.fromEntries(getSvcs().map(s=>[s.id,s.ico+' '+s.label]));
    main.appendChild(shdr(
      'Planificación',
      sala.nom+' · '+(svcMap[sala.servicio]||'')+'  —  Año lectivo '+anioLectivoActual()+' · Régimen Sierra · Días: '+diasSala.map(d=>d.charAt(0).toUpperCase()+d.slice(1,3)).join(', '),
      div({display:'flex',gap:'8px',flexWrap:'wrap'},
        btn('📕 PCA (PDF)','btn-light',()=>genPCA(sala)),
        btn(guardando?'Cancelar':'+ Nueva semana','btn-pri',()=>{guardando=!guardando;editId=null;if(!guardando)f=makePlan();draw();})
      )
    ));

    if(guardando){
      const fc=el('div',{cls:'card',style:{marginBottom:'18px'}});
      fc.appendChild(el('h4',{style:{margin:'0 0 14px',fontWeight:800}},editId?'✏️ Editar planificación semanal':'Nueva planificación semanal'));
      fc.appendChild(el('div',{cls:'g3'},
        fgrp('Mes',selEl(f.mes,MESES_LECTIVOS.map(m=>[m,m]),v=>f.mes=v)),
        fgrp('Semana — desde',inpEl(f.fi,'',v=>f.fi=v,'date')),
        fgrp('Semana — hasta',inpEl(f.ff,'',v=>f.ff=v,'date'))
      ));
      fc.appendChild(fgrp('Proyecto educativo / experiencia de aprendizaje',inpEl(f.proyecto,'Ej: Mi familia y yo',v=>f.proyecto=v)));
      const wg=div({display:'grid',gridTemplateColumns:'repeat('+diasSala.length+',1fr)',gap:'10px',marginBottom:'14px'});
      diasSala.forEach(d=>{
        const dc=div(null);
        dc.appendChild(el('label',{style:{display:'block',fontSize:'10px',fontWeight:700,color:'#6B7280',textTransform:'uppercase',marginBottom:'4px'}},d));
        const t=el('textarea',{cls:'inp',rows:'5',placeholder:'Actividades del '+d+'...'});
        t.value=f.dias[d]||'';
        t.addEventListener('input',e=>f.dias[d]=e.target.value);
        dc.appendChild(t);
        wg.appendChild(dc);
      });
      fc.appendChild(wg);
      fc.appendChild(fgrp('♿ Adaptaciones curriculares — niños/as con condición o discapacidad',txaEl(f.adapta,'Cómo se ajustan las actividades de esta semana: apoyos, materiales, tiempos, acompañamiento...',v=>f.adapta=v,2)));
      fc.appendChild(btn(editId?'Guardar cambios':'Guardar planificación','btn-pri',()=>{
        if(!f.fi||!f.ff){showToast('Ingresa el rango de fechas de la semana','#EF4444');return;}
        if(!DB.planif[sala.id])DB.planif[sala.id]=[];
        const data={id:editId||uid(),mes:f.mes,fi:f.fi,ff:f.ff,semana:rangoTxt(f.fi,f.ff),proyecto:f.proyecto,adapta:f.adapta,...f.dias};
        if(editId){const i=DB.planif[sala.id].findIndex(x=>x.id===editId);if(i>=0)DB.planif[sala.id][i]=data;else DB.planif[sala.id].unshift(data);}
        else DB.planif[sala.id].unshift(data);
        guardando=false;editId=null;f=makePlan();saveDB();draw();
        showToast('✅ Planificación guardada','#10B981');
      }));
      main.appendChild(fc);
    }

    if(!planes.length){

// ═══ PDF PLANIFICACIÓN MENSUAL (formato ministerio) ═══
function genPlanMensual(sala,mes,planes){
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  var mtr=DB.maestras.find(function(m){return m.id===sala.mid;});
  var DIAS=['lunes','martes','miercoles','jueves','viernes'];
  var DLBL={lunes:'LUNES',martes:'MARTES',miercoles:'MIÉRCOLES',jueves:'JUEVES',viernes:'VIERNES'};
  var dias=(sala.diasClase&&sala.diasClase.length)?sala.diasClase:DIAS;
  var proys=[];planes.forEach(function(pp){if(pp.proyecto&&proys.indexOf(pp.proyecto)<0)proys.push(pp.proyecto);});
  var filas='';
  planes.slice().reverse().forEach(function(pl,i){
    filas+='<tr><td class="sem"><strong>SEMANA '+(i+1)+'</strong><br>'+esc(pl.semana||'')+(pl.proyecto?'<br><em>'+esc(pl.proyecto)+'</em>':'')+'</td>'+
      dias.map(function(d){return '<td>'+esc(pl[d]||'—').replace(/\n/g,'<br>')+'</td>';}).join('')+'</tr>';
    if(pl.adapta)filas+='<tr><td class="adap" colspan="'+(dias.length+1)+'">♿ <strong>Adaptaciones curriculares (niños/as con condición o discapacidad):</strong> '+esc(pl.adapta).replace(/\n/g,'<br>')+'</td></tr>';
  });
  var html='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Planificación Mensual — '+esc(mes)+'</title><style>'+
    '*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;font-size:10pt;color:#111;padding:24px}'+
    'h1{font-size:13pt;text-align:center;text-transform:uppercase}h2{font-size:11pt;text-align:center;font-weight:normal;margin-top:2px}'+
    'table{width:100%;border-collapse:collapse;margin-top:10px}td,th{border:1px solid #333;padding:6px 8px;vertical-align:top;text-align:left}'+
    'th{background:#E8E4F8;text-transform:uppercase;font-size:9pt}.meta td{font-size:9.5pt}.sem{width:150px;background:#F6F4FC}'+
    '.adap{background:#FFF7DF;font-size:9pt}.firmas{margin-top:46px;display:flex;justify-content:space-around;text-align:center;font-size:9.5pt}'+
    '.firmas div{width:230px;border-top:1px solid #333;padding-top:6px}.noprint{margin:14px auto;text-align:center}'+
    '@media print{.noprint{display:none}body{padding:0}}@page{size:A4 landscape;margin:14mm}'+
    '</style></head><body>'+
    '<h1>Planificación Mensual — Educación Inicial</h1>'+
    '<h2>Cuidado Infantil el Colibrí · Año lectivo 2026-2027 · Régimen Sierra</h2>'+
    '<div class="noprint"><button onclick="window.print()" style="padding:8px 22px;font-size:11pt;cursor:pointer">🖨 Imprimir / Guardar PDF</button></div>'+
    '<table class="meta">'+
    '<tr><td><strong>MES:</strong> '+esc(mes)+'</td><td><strong>GRUPO / NIVEL:</strong> '+esc(sala.nom+(sala.rango?' ('+sala.rango+')':''))+'</td></tr>'+
    '<tr><td><strong>DOCENTE:</strong> '+esc(mtr?mtr.nom:'—')+'</td><td><strong>DIRECTORA:</strong> '+esc(nomDirectora())+'</td></tr>'+
    (proys.length?'<tr><td colspan="2"><strong>PROYECTO EDUCATIVO / EXPERIENCIA DE APRENDIZAJE:</strong> '+esc(proys.join(' · '))+'</td></tr>':'')+
    '</table>'+
    '<table><tr><th style="width:150px">Semana</th>'+dias.map(function(d){return '<th>'+DLBL[d]+'</th>';}).join('')+'</tr>'+filas+'</table>'+
    '<div class="firmas"><div>Docente<br><strong>'+esc(mtr?mtr.nom:'')+'</strong></div><div>Directora<br><strong>'+esc(nomDirectora())+'</strong></div></div>'+
    '</body></html>';
  window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})),'_blank');
}

 obj:'Explorar y representar diferentes profesiones a través del juego simbólico, dramatizaciones y actividades lúdicas, favoreciendo en los niños y niñas la comprensión de los roles sociales, el respeto por el trabajo de los demás y el desarrollo de su imaginación y lenguaje.',
 dz:[['Identidad y Autonomía',['Comunicar algunos datos de su identidad como: nombres completos, edad, nombres de familiares cercanos, lugar donde vive.','Identificar sus características físicas y las de las personas de su entorno como parte del proceso de aceptación de sí mismo y de respeto a las demás personas.','Identificar la importancia de usar el cinturón de seguridad para promover el autocuidado y la protección personal.']],
 ['Convivencia',['Participar en juegos grupales siguiendo las reglas y asumiendo roles que le permitan mantener un ambiente armónico con sus pares.','Identificar las profesiones, oficios y ocupaciones que cumplen los miembros de su familia.','Identificar instituciones y profesiones que brindan servicios a la comunidad y los roles que ellos cumplen.']],
 ['Cívica y Acompañamiento Integral',['Identificar los símbolos nacionales del país en actividades escolares fomentando la inclusión y el sentido de pertenencia.','Expresar sus emociones y necesidades básicas, fortaleciendo la capacidad de adaptación al cambio en el contexto escolar.','Tomar decisiones éticas sencillas, para la resolución de conflictos en actividades lúdicas y cotidianas.']],
 ['Relaciones con el medio natural y cultural',['Establecer comparaciones entre los elementos del entorno a través de la discriminación sensorial.','Comunicar de manera asertiva sus preferencias o desacuerdos al interactuar con sus pares reconociendo cómo sus expresiones o acciones influyen en las otras personas.']],
 ['Relaciones lógico-matemáticas',['Identificar características de mañana, tarde y noche.','Experimentar la mezcla de dos colores primarios para formar colores secundarios (morado).','Reconocer los colores secundarios en objetos e imágenes del entorno.','Reconocer la ubicación de objetos en relación a sí mismo y diferentes puntos de referencia según las nociones espaciales de: entre, adelante/atrás, junto a, cerca/lejos.','Establecer la relación de correspondencia entre los elementos de colecciones de objetos.','Contar oralmente del 1 al 15 con secuencia numérica.','Comprender la relación de número-cantidad hasta el 10 (número 5).','Comprender la relación del numeral (representación simbólica del número) con la cantidad hasta el 5 (número 5).','Reconocer billetes y monedas en situaciones de la vida real.']],
 ['Comprensión y Expresión del Lenguaje',['Reconocer etiquetas y rótulos de su entorno inmediato y “leerlos”.','Identificar “auditivamente” el fonema (sonido) inicial de las palabras más utilizadas (vocal o).','Producir palabras que riman espontáneamente tomando en cuenta los sonidos finales de las mismas.','Participar en conversaciones más complejas y largas manteniéndose dentro del tema.']],
 ['Expresión Artística',['Participar en dramatizaciones, asumiendo roles de diferentes personas del entorno y de personajes de cuentos e historietas.','Realizar actividades creativas utilizando las técnicas grafo-plásticas con variedad de materiales.','Expresar su opinión al observar una obra artística relacionada a la plástica o a la escultura.']],
 ['Expresión Corporal y Motricidad',['Realizar movimientos para la coordinación de ojo y pie como: patear pelotas hacia un punto fijo determinado.','Realizar desplazamientos y movimientos combinados utilizando el espacio total y parcial a diferentes distancias (largas–cortas).','Orientarse en el espacio realizando desplazamientos en función de consignas dadas con las nociones: entre, adelante–atrás, junto a, cerca–lejos.','Representar la figura humana utilizando el monigote e incorporando detalles según la interiorización de su imagen corporal.']]]},
{n:8,t:'“Carnaval de colores”',f:'02 al 20 de febrero',s:'3 semanas',
 obj:'Disfrutar y participar en actividades lúdicas relacionadas con el carnaval, explorando los colores, la música y las tradiciones propias de la festividad, para favorecer la creatividad y la expresión artística.',
 dz:[['Identidad y Autonomía',['Practicar con autonomía hábitos de higiene personal como lavarse las manos, los dientes y la cara.','Identificar las situaciones de peligro a las que se puede exponer en su entorno inmediato y seguir pautas de comportamiento para evitarlas.']],
 ['Convivencia',['Demostrar actitudes de solidaridad ante situaciones de necesidad de sus compañeras, compañeros y personas adultas de su entorno.','Observar las expresiones faciales y comportamientos de otras niñas y niños en actividades lúdicas para identificar sus emociones, guiar sus propias acciones y fomentar un ambiente de convivencia armónica.']],
 ['Cívica y Acompañamiento Integral',['Identificar los símbolos nacionales del país en actividades escolares fomentando la inclusión y el sentido de pertenencia.','Participar en actividades de cooperación utilizando un lenguaje claro y respetuoso.','Reconocer y responder a las emociones de sus compañeras y compañeros para desarrollar empatía y manejar conflictos en actividades grupales y lúdicas.']],
 ['Relaciones con el medio natural y cultural',['Participar en algunas prácticas tradicionales de su entorno disfrutando y respetando las diferentes manifestaciones culturales.','Identificar en las actividades diarias oportunidades para aprovechar los recursos y reducir los residuos para proteger el entorno natural.']],
 ['Relaciones lógico-matemáticas',['Experimentar la mezcla de dos colores primarios para formar colores secundarios (color café).','Reconocer los colores secundarios en objetos e imágenes del entorno.','Contar oralmente del 1 al 15 con secuencia numérica.','Comprender la relación de número-cantidad hasta el 10 (número 6).','Comparar y ordenar secuencialmente un conjunto pequeño de objetos de acuerdo con su tamaño.','Comparar y armar colecciones de más, igual y menos objetos.','Continuar y reproducir patrones simples con objetos concretos y representaciones gráficas.']],
 ['Comprensión y Expresión del Lenguaje',['Seguir instrucciones sencillas que involucren la ejecución de tres o más actividades.','Participar en conversaciones más complejas y largas manteniéndose dentro del tema.','Expresarse oralmente pronunciando correctamente la mayoría de las palabras (puede presentar dificultades en la pronunciación de la s y la r).','Identificar “auditivamente” el fonema (sonido) inicial de las palabras más utilizadas (vocal u).']],
 ['Expresión Artística',['Participar en rondas populares, bailes y juegos tradicionales, asumiendo los roles y respetando las reglas.','Expresar sus emociones utilizando materiales artísticos para reflejar su estado emocional, para autocuidarse canalizando sentimientos de alegría, tristeza o frustración, sin asociar roles o conductas a expectativas de género.']],
 ['Expresión Corporal y Motricidad',['Ejecutar actividades coordinadamente y con un control adecuado de fuerza y tonicidad muscular como: lanzar, atrapar y patear objetos y pelotas.','Mantener el equilibrio al caminar sobre líneas rectas, curvas y quebradas con altura (aprox. 20 cm) logrando un adecuado control postural.','Emplear su lado dominante en la realización de la mayoría de las actividades que utilice la mano, ojo y pie.','Utilizar la pinza digital para coger lápices, marcadores, pinceles y diversos tipos de materiales.']]]},
{n:9,t:'“Amigos de la naturaleza” (hábitat)',f:'23 de febrero al 13 de marzo',s:'3 semanas',
 obj:'Fomentar en los niños y niñas el respeto y cuidado por los animales y plantas, desarrollando conciencia ambiental, observación de la naturaleza y hábitos de responsabilidad hacia el entorno que los rodea.',
 dz:[['Identidad y Autonomía',['Identificar las situaciones de peligro a las que se puede exponer en su entorno inmediato y seguir pautas de comportamiento para evitarlas.']],
 ['Convivencia',['Participar en juegos grupales siguiendo las reglas y asumiendo roles que le permitan mantener un ambiente armónico con sus pares.','Demostrar actitudes de solidaridad ante situaciones de necesidad de sus compañeras, compañeros y personas adultas de su entorno.']],
 ['Cívica y Acompañamiento Integral',['Identificar los símbolos nacionales del país en actividades escolares fomentando la inclusión y el sentido de pertenencia.']],
 ['Relaciones con el medio natural y cultural',['Identificar las características de los animales domésticos y silvestres estableciendo las diferencias entre ellos.','Construir conexiones emocionales con su contexto natural (plantas, animales, agua, tierra, aire) y social.','Diferenciar los seres vivos y elementos no vivos de su entorno explorando su mundo natural.','Identificar las características del mar y reconocerlo como una parte integral del territorio nacional.']],
 ['Relaciones lógico-matemáticas',['Ordenar en secuencia lógica sucesos de hasta cinco eventos en representaciones gráficas de sus actividades de la rutina diaria y en escenas de cuentos.','Identificar semejanzas y diferencias en objetos del entorno con criterios de forma, color y tamaño.','Continuar y reproducir patrones simples con objetos concretos y representaciones gráficas.','Contar oralmente del 1 al 15 con secuencia numérica.','Comprender la relación de número-cantidad hasta el 10 (número 7).']],
 ['Comprensión y Expresión del Lenguaje',['Reproducir trabalenguas sencillos, adivinanzas, canciones y poemas cortos, mejorando su pronunciación y potenciando su capacidad imaginativa.','Asociar la imagen de la portada con el título de los cuentos conocidos.','Colaborar en la creación de textos colectivos con la ayuda del docente.','Expresarse oralmente pronunciando correctamente la mayoría de las palabras (puede presentar dificultades en la pronunciación de la s y la r).','Comunicar de manera escrita sus ideas intentando imitar letras o formas parecidas a letras.']],
 ['Expresión Artística',['Discriminar sonidos onomatopéyicos y diferenciar los sonidos naturales de los artificiales.']],
 ['Expresión Corporal y Motricidad',['Saltar de un pie a otro alternadamente, de manera autónoma.','Trepar y reptar a diferentes ritmos y en posiciones corporales diversas (cúbito ventral y cúbito dorsal).','Realizar ejercicios de equilibrio estático y dinámico, controlando los movimientos de las partes gruesas del cuerpo y estructurando motricidad facial y gestual según la consigna incrementando el tiempo.','Utilizar la pinza digital para coger lápices, marcadores, pinceles y diversos tipos de materiales.']]]},
{n:10,t:'“Semana de refuerzo”',f:'16 al 20 de marzo',s:'1 semana',ref:true,
 obj:'Consolidar y fortalecer los aprendizajes adquiridos durante el segundo trimestre, reforzando las competencias cognitivas, sociales y emocionales de los niños y niñas mediante actividades lúdicas, motivadoras y adaptadas a sus necesidades individuales.'},
{tri:'TERCER TRIMESTRE',n:11,t:'“Feliz cumpleaños el Colibrí”',f:'23 de marzo al 02 de abril',s:'2 semanas',

 ['Cívica y Acompañamiento Integral',['Identificar los símbolos nacionales del país en actividades escolares fomentando la inclusión y el sentido de pertenencia.','Comprender las reglas de convivencia en el espacio escolar y familiar, colaborando en tareas simples.','Explorar las prácticas democráticas (la cooperación, la participación y el respeto) en simulaciones y situaciones cotidianas.']],
 ['Relaciones con el medio natural y cultural',['Participar en algunas prácticas tradicionales de su entorno disfrutando y respetando las diferentes manifestaciones culturales.']],

 ['Expresión Corporal y Motricidad',['Realizar representaciones gráficas utilizando el dibujo con detalles que le dan intencionalidad y sentido para identificarlos.','Participar en dramatizaciones y actividades lúdicas que representen situaciones cotidianas en la vía para identificar y respetar las señales de tránsito básicas (semáforos, señales de pare y cruces peatonales), promoviendo un comportamiento seguro y ordenado.']]]},
{n:12,t:'“Guardianes del jardín”',f:'06 al 17 de abril',s:'2 semanas',

 dz:[['Identidad y Autonomía',['Practicar las acciones a seguir en situaciones de riesgo como: temblores, incendios, entre otros, determinadas en el plan de contingencia institucional.']],
 ['Convivencia',['Colaborar en actividades que se desarrollan con otras niñas, niños y personas adultas de su entorno.']],
 ['Cívica y Acompañamiento Integral',['Identificar los símbolos nacionales del país en actividades escolares fomentando la inclusión y el sentido de pertenencia.','Participar en actividades que promuevan el cuidado del entorno y el respeto hacia las demás personas en el contexto de actividades lúdicas y rutinas diarias.','Tomar decisiones éticas sencillas, para la resolución de conflictos en actividades lúdicas y cotidianas.']],
 ['Relaciones con el medio natural y cultural',['Identificar características de las plantas por su utilidad, estableciendo diferencias entre ellas.','Explorar e identificar los diferentes elementos y fenómenos del entorno natural mediante procesos que propicien la indagación.']],
 ['Relaciones lógico-matemáticas',['Identificar las nociones de tiempo en acciones que suceden antes, ahora y después.','Reconocer la ubicación de objetos en relación a sí mismo y diferentes puntos de referencia según las nociones espaciales de: entre, adelante/atrás, junto a, cerca/lejos.','Identificar en los objetos las nociones de medida: largo/corto, grueso/delgado.','Identificar semejanzas y diferencias en objetos del entorno con criterios de forma, color y tamaño (tamaño).','Contar oralmente del 1 al 15 con secuencia numérica.','Comprender la relación de número-cantidad hasta el 10 (número 9).']],
 ['Comprensión y Expresión del Lenguaje',['Relatar cuentos, narrados por una persona adulta, manteniendo la secuencia, sin la ayuda del paratexto.','Identificar “auditivamente” el fonema (sonido) inicial de las palabras más utilizadas.','Comunicar de manera escrita sus ideas intentando imitar letras o formas parecidas a letras.','Comunicarse a través de dibujos de objetos con detalles que lo vuelven identificables, como representación simbólica de sus ideas.']],
 ['Expresión Artística',['Ejecutar patrones de más de dos ritmos con partes del cuerpo y elementos o instrumentos sonoros.']],
 ['Expresión Corporal y Motricidad',['Trepar y reptar a diferentes ritmos y en posiciones corporales diversas (cúbito ventral y cúbito dorsal).','Utilizar la pinza digital para coger lápices, marcadores, pinceles y diversos tipos de materiales.','Ubicar algunas partes de su cuerpo en función de las nociones de al lado, junto a, cerca–lejos.']]]},
{n:13,t:'“Mi primer viaje”',f:'20 al 30 de abril',s:'2 semanas',
 obj:'Desarrollar en los niños y niñas el conocimiento de los distintos medios de transporte, fomentando la observación, la comprensión de su uso en la vida cotidiana y el respeto por normas de seguridad vial, a través de actividades lúdicas y prácticas.',
 dz:[['Identidad y Autonomía',['Reconocer la importancia del uso del casco y demás indumentaria para protegerse de lesiones en actividades que requieran su uso.','Identificar la importancia de usar el cinturón de seguridad para promover el autocuidado y la protección personal.','Practicar normas de seguridad para evitar accidentes a los que se puede exponer en su entorno inmediato.']],
 ['Convivencia',['Demostrar cortesía y respeto hacia los actores viales (peatones, conductores, motociclistas, ciclistas, personas con discapacidad, movilidad reducida, grupos vulnerables, pasajeros, agentes y policías de tránsito) a través de actividades lúdicas que promuevan comportamientos adecuados en situaciones de tránsito.','Desarrollar la capacidad de esperar para obtener una recompensa mayor en el futuro.']],
 ['Cívica y Acompañamiento Integral',['Identificar los símbolos nacionales del país en actividades escolares fomentando la inclusión y el sentido de pertenencia.','Expresar, a través de actividades lúdicas, la comprensión de que todas las personas tienen derechos, sin discriminación.']],
 ['Relaciones con el medio natural y cultural',['Practicar hábitos de cuidado y conservación del medio ambiente que eviten la contaminación del aire, suelo y agua.','Participar en actividades lúdicas para identificar prácticas de movilidad que ayudan a cuidar el planeta.','Reconocer los medios de transporte sostenibles como: bicicleta, scooters, patinetes, transporte público, tranvías, metros y caminar, por medio de actividades lúdicas.','Establecer comparaciones entre los elementos del entorno a través de la discriminación sensorial.']],
 ['Relaciones lógico-matemáticas',['Contar oralmente del 1 al 15 con secuencia numérica.','Comprender la relación de número-cantidad hasta el 10 (número 10).','Relacionar las distintas formas de adquirir dinero con el trabajo y el esfuerzo.','Comparar y ordenar secuencialmente un conjunto pequeño de objetos de acuerdo con su tamaño.']],
 ['Comprensión y Expresión del Lenguaje',['Identificar “auditivamente” el fonema (sonido) inicial de las palabras más utilizadas (vocales).','Producir palabras que riman espontáneamente tomando en cuenta los sonidos finales de las mismas.','Reproducir trabalenguas sencillos, adivinanzas, canciones y poemas cortos, mejorando su pronunciación y potenciando su capacidad imaginativa.','Realizar modificaciones del contenido de un cuento relatado por una persona adulta, cambiando partes de él como: acciones y final.','Realizar movimientos articulatorios complejos: movimientos de los labios juntos de izquierda a derecha, hacia adelante, movimiento de las mandíbulas a los lados, inflar las mejillas y movimiento de lengua de mayor dificultad.']],
 ['Expresión Artística',['Discriminar sonidos onomatopéyicos y diferenciar los sonidos naturales de los artificiales.','Realizar actividades creativas utilizando las técnicas grafo-plásticas con variedad de materiales.']],
 ['Expresión Corporal y Motricidad',['Saltar de un pie a otro alternadamente, de manera autónoma.','Reconocer la importancia del peatón y respetar su espacio en la vía mediante actividades lúdicas que fomenten el aprendizaje de normas de tránsito.','Realizar representaciones gráficas utilizando el dibujo con detalles que le dan intencionalidad y sentido para identificarlos.','Realizar movimientos diferenciados con los lados laterales del cuerpo (un lado y otro lado).']]]},

 ['Cívica y Acompañamiento Integral',['Identificar los símbolos nacionales del país en actividades escolares fomentando la inclusión y el sentido de pertenencia.','Nombrar los valores y creencias familiares que implican el respeto por sí mismos y por las demás personas, en conversaciones guiadas y actividades lúdicas.']],

 ['Relaciones lógico-matemáticas',['Comparar y armar colecciones de más, igual y menos objetos.','Identificar la diferencia entre lo que se desea y lo que se necesita.','Identificar los números de emergencia a través de actividades lúdicas, y reconocer cuándo pedir ayuda en situaciones sencillas.','Establecer la relación de correspondencia entre los elementos de colecciones de objetos.']],
 ['Comprensión y Expresión del Lenguaje',['Comunicarse incorporando palabras nuevas a su vocabulario en función de los ambientes y experiencias en las que interactúa.','Identificar una persona adulta de confianza para solicitar apoyo al enfrentar desafíos emocionales en situaciones cotidianas del entorno escolar.','Comunicarse a través de dibujos de objetos con detalles que lo vuelven identificables, como representación simbólica de sus ideas.','Contar un cuento con base a sus imágenes a partir de la portada y siguiendo la secuencia de las páginas.']],

        div({flex:1},p({margin:0,fontWeight:800,fontSize:'14px'},'Consulta del '+(cm.fecha?new Date(cm.fecha+'T12:00:00').toLocaleDateString('es-EC',{day:'numeric',month:'long',year:'numeric'}):'—')),p({margin:0,fontSize:'12px',color:'#6B7280'},cm.medico?'Dr(a). '+cm.medico:'Médico no registrado')),
        editable?btn('✏️ Editar','btn-sm',()=>openConsulta(cm),{background:'#EDE9FE',color:'#7C3AED',border:'none',borderRadius:'8px'}):null

      if(gm.children.length)c.appendChild(gm);
      if(cm.diagnostico)c.appendChild(div({background:'#EDE9FE',borderRadius:'10px',padding:'10px 12px',marginBottom:'8px'},p({margin:0,fontSize:'10px',fontWeight:700,color:'#5B21B6',textTransform:'uppercase'},'Diagnóstico / estado de salud'),p({margin:'3px 0 0',fontSize:'13px'},cm.diagnostico)));
      if(cm.recomendaciones)c.appendChild(div({background:'#D1FAE5',borderRadius:'10px',padding:'10px 12px',marginBottom:'8px'},p({margin:0,fontSize:'10px',fontWeight:700,color:'#059669',textTransform:'uppercase'},'Recomendaciones del médico'),p({margin:'3px 0 0',fontSize:'13px'},cm.recomendaciones)));
      if(cm.medicacion)c.appendChild(div({background:'#FEF3C7',borderRadius:'10px',padding:'10px 12px',marginBottom:'8px'},p({margin:0,fontSize:'10px',fontWeight:700,color:'#D97706',textTransform:'uppercase'},'Medicación indicada'),p({margin:'3px 0 0',fontSize:'13px'},cm.medicacion)));
      if(cm.proxima)c.appendChild(p({margin:'4px 0 0',fontSize:'12px',color:'#6B7280',fontWeight:600},'📅 Próxima consulta: '+new Date(cm.proxima+'T12:00:00').toLocaleDateString('es-EC',{day:'numeric',month:'long',year:'numeric'})));
      wrap.appendChild(c);
    });
  }
  function openConsulta(existing){
    let f=existing?{...existing}:{fecha:fmt(HOY),medico:'',peso:'',talla:'',temp:'',diagnostico:'',recomendaciones:'',medicacion:'',proxima:''};
    const {close}=modal([
      el('h3',{style:{margin:'0 0 14px',fontWeight:900}},existing?'✏️ Editar consulta médica':'🩺 Nueva consulta médica'),
      p({margin:'0 0 14px',color:'#6B7280',fontSize:'13px'},nino.nom+' · registro de la revisión del médico'),
      el('div',{cls:'g2'},fgrp('Fecha de la consulta',inpEl(f.fecha,'',v=>f.fecha=v,'date')),fgrp('Médico que revisa',inpEl(f.medico,'Nombre del médico',v=>f.medico=v))),
      el('div',{cls:'g3'},fgrp('Peso (kg)',inpEl(f.peso,'',v=>f.peso=v,'number')),fgrp('Talla (cm)',inpEl(f.talla,'',v=>f.talla=v,'number')),fgrp('Temp. (°C)',inpEl(f.temp,'',v=>f.temp=v,'number'))),
      fgrp('Diagnóstico / estado de salud',txaEl(f.diagnostico,'Resultado de la revisión médica...',v=>f.diagnostico=v,3)),
      fgrp('Recomendaciones',txaEl(f.recomendaciones,'Indicaciones para el centro y la familia...',v=>f.recomendaciones=v,2)),
      fgrp('Medicación (si aplica)',inpEl(f.medicacion,'',v=>f.medicacion=v)),
      fgrp('Próxima consulta (opcional)',inpEl(f.proxima,'',v=>f.proxima=v,'date')),
      div({display:'flex',gap:'10px',flexWrap:'wrap'},
        btn('Guardar consulta','btn-grn',()=>{
          if(!f.fecha){showToast('Ingresa la fecha de la consulta','#EF4444');return;}
          if(existing)Object.assign(existing,f);
          else nino.fmed.push({...f,id:uid()});
          saveDB();close();redraw();showToast('🩺 Consulta guardada','#10B981');
        }),
        existing?btn('🗑 Eliminar','btn-light-red',()=>{if(!confirm('¿Eliminar esta consulta médica?'))return;nino.fmed=nino.fmed.filter(x=>x.id!==existing.id);saveDB();close();redraw();showToast('Consulta eliminada','#EF4444');}):null,
        btn('Cancelar','btn-light',()=>close())
      )
    ],()=>close());
  }
  build();
  return wrap;
}
