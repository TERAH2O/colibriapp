.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}

function dirData(){ if(!DB.directora||typeof DB.directora!=='object') DB.directora={}; return DB.directora; }
function nomDirectora(){ return (DB.nombreDirectora||'').trim() || 'Directora'; }
function fotoDirectora(){ return dirData().foto || null; }
function cKeyComu(c){ return c.id || (c.titulo+'|'+c.fecha); }
function comusDe(u){ if(!u)return[]; if(u.rol==='papa'){ var n=DB.ninos.find(function(x){return x.id===u.nid;}); var sid=n?n.sid:null; return (DB.comus||[]).filter(function(c){return c.sid==='all'||(sid&&c.sid===sid);}); } return DB.comus||[]; }
function comusVistos(){ try{ return JSON.parse(localStorage.getItem('colibriapp_comusVistos_'+(USER?USER.cod:''))||'[]'); }catch(e){ return []; } }
function comusNoVistos(){ if(!USER||USER.rol!=='papa')return 0; var v=comusVistos(); return comusDe(USER).filter(function(c){return v.indexOf(cKeyComu(c))<0;}).length; }
function marcarComusVistos(){ if(!USER)return; try{ localStorage.setItem('colibriapp_comusVistos_'+USER.cod, JSON.stringify(comusDe(USER).map(cKeyComu))); }catch(e){} actualizarBadgeComus(); }
function actualizarBadgeComus(){ var n=comusNoVistos(); document.querySelectorAll('[data-comu-badge]').forEach(function(b){ b.textContent=n>9?'9+':String(n); b.style.display=n>0?'inline-flex':'none'; }); }

// ── Cumpleaños: aviso desde un día antes ──────────
function proximosCumples(){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  function diasPara(nac){
    if(!nac) return -1;
    var d=new Date(nac+'T12:00:00'); if(isNaN(d.getTime())) return -1;
    var prox=new Date(hoy.getFullYear(),d.getMonth(),d.getDate());
    if(prox<hoy) prox=new Date(hoy.getFullYear()+1,d.getMonth(),d.getDate());
    return Math.round((prox-hoy)/86400000);
  }
  function edadQueCumple(nac){
    var d=new Date(nac+'T12:00:00');
    var e=hoy.getFullYear()-d.getFullYear();
    var prox=new Date(hoy.getFullYear(),d.getMonth(),d.getDate());
    if(prox<hoy)e++;
    return e;
  }
  var lista=[];

// ── Subir TODA la DB a Firestore (con cola, sin perder cambios) ──
function guardarEnFirebase() {
  if (!fsDB || !fbOnline) { fbPendiente = true; return; }
  if (!fbPrimeraCarga) {
    // CRITICO: nunca subir nada antes de conocer lo que hay en la nube
    // (evita que un dispositivo nuevo con datos demo borre los datos reales)
    fbPendiente = true;
    fbLogPush('⏳ Esperando datos de la nube antes de subir...');
    return;
  }
  if (fbGuardando) { fbPendiente = true; return; }
  fbGuardando = true;
  fbPendiente = false;
  setFbStatus('saving');

  var payload = armarPayload();
  var tam = 0;
  try { tam = JSON.stringify(payload).length; } catch(e) {}
  if (tam > 900000) {
    fbLogPush('⚠️ Datos cerca del limite de 1MB de Firestore (' + Math.round(tam/1024) + ' KB)');
  }

  fsDB.collection(FB_COL).doc(FB_DOC).set(payload)
    .then(function() {
      fbGuardando = false;
      try { localStorage.removeItem(DIRTY_KEY); } catch(e) {}
      setFbStatus('online', 'guardado ✓');
      setTimeout(function() { setFbStatus('online'); }, 2000);
      fbLogPush('✅ Guardado en la nube (' + Math.round(tam/1024) + ' KB)');
      if (fbPendiente) guardarEnFirebase(); // cambios que llegaron mientras se guardaba
    })
    .catch(function(err) {
      fbGuardando = false;
      fbPendiente = true; // no perder el cambio: reintentar
      fbLogPush('❌ Error al guardar: ' + err.code + ' — ' + err.message);
      setFbStatus('error', err.code);
      if (err.code === 'permission-denied') {
        mostrarErrorReglas();
      } else {
        setTimeout(function() { if (fbPendiente && !fbGuardando) guardarEnFirebase(); }, 5000);
      }
    });
}

  if (!DB.historialAsistencia) DB.historialAsistencia = [];

// ── Escucha en tiempo real ────────────────────────
function iniciarEscucha() {
  if (!fsDB) return;
  if (fbListener) fbListener(); // desuscribir anterior

  fbListener = fsDB.collection(FB_COL).doc(FB_DOC)
    .onSnapshot(
      function(snap) {
        var esPrimera = !fbPrimeraCarga;
        fbPrimeraCarga = true;

        // Mi propia escritura aun sin confirmar por el servidor — ignorar
        if (snap.metadata && snap.metadata.hasPendingWrites) return;

        if (!snap.exists) {
          fbLogPush('☁️ La nube esta vacia');
          setFbStatus('online', 'nube vacia');
          // Solo sembrar la nube si este dispositivo tiene cambios reales
          if (fbPendiente || fbDirtyAlInicio) guardarEnFirebase();
          return;
        }

        var data = snap.data();

        if (esPrimera) {
          var remoto = data._savedAt || (data.guardado_en ? new Date(data.guardado_en).getTime() : 0);
          var local  = DB._savedAt || 0;
          if (fbDirtyAlInicio && local > remoto) {
            // Este dispositivo quedo con cambios sin subir mas nuevos que la nube
            fbLogPush('⬆️ Cambios locales pendientes mas recientes — subiendo a la nube');
            guardarEnFirebase();
            return;
          }
          fbLogPush('📥 Datos de la nube recibidos — aplicando');
          fbPendiente = false;
          fbDirtyAlInicio = false;
          try { localStorage.removeItem(DIRTY_KEY); } catch(e) {}
          aplicarDatosRemotos(data);
          return;
        }

        // Eco de mi propio guardado ya confirmado — no re-renderizar
        if (data.guardado_por === DEVICE_ID) { setFbStatus('online'); return; }

        fbLogPush('📥 Cambios desde otro dispositivo — aplicando');
        aplicarDatosRemotos(data);
      },
      function(err) {
        fbLogPush('❌ onSnapshot: ' + err.code + ' — ' + err.message);
        setFbStatus('error', err.code);
        if (err.code === 'permission-denied') mostrarErrorReglas();
      }
    );
  fbLogPush('👂 Escucha activa en ' + FB_COL + '/' + FB_DOC);
}

// ── Conectar a Firestore ──────────────────────────
function conectarFirebase() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    setFbStatus('connecting');
    fsDB = firebase.firestore();
    // Cache offline: los datos sobreviven recargas aun sin internet
    try {
      fsDB.enablePersistence({synchronizeTabs:true}).catch(function(e) {
        fbLogPush('Cache offline no disponible: ' + ((e && e.code) || e));
      });
    } catch(e) {}
    fbOnline = true;
    fbLogPush('✅ Firestore conectado · dispositivo ' + DEVICE_ID);
    // Auth anonima por si las reglas la requieren (no bloquea si esta deshabilitada)
    try {
      firebase.auth().signInAnonymously()
        .then(function() { fbLogPush('🔑 Sesion anonima iniciada'); })
        .catch(function(e) { fbLogPush('Auth anonima no disponible (' + e.code + ') — ok si las reglas son publicas'); });
    } catch(e) {}
    iniciarEscucha();
    // Failsafe: si en 12s no llega ningun snapshot, avisar
    setTimeout(function() {
      if (!fbPrimeraCarga) {
        setFbStatus('error', 'sin respuesta de Firestore');
        fbLogPush('⚠️ 12s sin respuesta de Firestore — revisa internet, reglas o restricciones de la API key');
      }
    }, 12000);
  } catch(e) {
    fbLogPush('❌ initializeApp: ' + e.message);
    setFbStatus('error');
  }
}

// ── saveDB: guardar local + nube (con debounce) ───
function saveDB() {
  guardarLocal();
  try { localStorage.setItem(DIRTY_KEY, '1'); } catch(e) {}
  fbPendiente = true;
  if (fbTimer) clearTimeout(fbTimer);
  fbTimer = setTimeout(function() {
    fbTimer = null;
    guardarEnFirebase();
  }, 700);
  if (!fbOnline) fbLogPush('💾 Guardado local — se sincronizara al conectar con la nube');
}

// ── Cargar localStorage ───────────────────────────
function loadLocalDB() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { console.log('[Firebase] localStorage vacio'); return; }
    var saved = JSON.parse(raw);
    if (saved.DB) {
      Object.assign(DB, saved.DB);
      if (!DB.fotos) DB.fotos = {s1:[], s2:[], s3:[]};
      console.log('[Firebase] Datos locales cargados');
    }
    if (saved.USERS && saved.USERS.length > 0) {
      USERS.length = 0;
      saved.USERS.forEach(function(u) { USERS.push(u); });
    }
  } catch(e) { console.warn('[Firebase] Error localStorage:', e); }
}

// ── Cargar Firebase SDK dinamicamente ────────────
function cargarYConectarFirebase() {
  var VER  = '10.12.0';
  var intentos = [
    'https://www.gstatic.com/firebasejs/' + VER + '/',
    'https://cdn.jsdelivr.net/npm/firebase@' + VER + '/'
  ];
  var idx = 0;

  function probarCDN() {
    if (idx >= intentos.length) {
      fbLogPush('❌ No se pudo cargar el SDK de Firebase (sin internet o bloqueado)');
      setFbStatus('error', 'sin SDK');
      mostrarBannerLocal();
      return;
    }
    var base = intentos[idx++];
    loadScript(base + 'firebase-app-compat.js', function() {
      loadScript(base + 'firebase-auth-compat.js', function() {
        loadScript(base + 'firebase-firestore-compat.js', function() {
          fbLogPush('SDK cargado desde: ' + base);
          conectarFirebase();
        }, probarCDN);
      }, probarCDN);
    }, probarCDN);
  }

  function loadScript(url, ok, fail) {
    if (document.querySelector('script[src="' + url + '"]')) { ok(); return; }
    var s = document.createElement('script');
    s.src = url;
    s.onload = ok;
    s.onerror = function() { s.remove(); if (fail) fail(); };
    document.head.appendChild(s);
  }

  probarCDN();
}

function migrarAnioLectivo(){
  var al = String(DB.anioLectivo || '');
  if (!/^\d{4}-\d{4}$/.test(al) || parseInt(al, 10) < 2026) DB.anioLectivo = '2026-2027';

// Un código sólo es válido si coincide con la ficha actual (el anterior deja de servir)
function sanearUsuarios(){
  var norm = function(c){ return String(c || '').trim().toUpperCase(); };
  USERS.forEach(function(u){
    if (u.rol === 'papa') {
      var n = (DB.ninos || []).find(function(x){ return x.id === u.nid; });
      if (n && n.codp) u.cod = norm(n.codp);
    } else if (u.rol === 'maestra') {
      var m = (DB.maestras || []).find(function(x){ return x.id === u.mid; });
      if (m && m.cod) u.cod = norm(m.cod);
    }
    u.cod = norm(u.cod);
  });
  // quitar accesos huérfanos y duplicados (gana el registro más reciente)
  var porPersona = {}, orden = [];
  USERS.forEach(function(u){
    if (u.rol === 'papa' && !(DB.ninos || []).some(function(x){ return x.id === u.nid; })) return;
    if (u.rol === 'maestra' && u.mid && !(DB.maestras || []).some(function(x){ return x.id === u.mid; })) return;
    var k = u.rol + '|' + (u.nid || u.mid || u.rol);
    if (!(k in porPersona)) orden.push(k);
    porPersona[k] = u;
  });
  var limpio = [], codigos = {};
  orden.forEach(function(k){
    var u = porPersona[k];
    if (!u.cod || codigos[u.cod]) return;
    codigos[u.cod] = true;
    limpio.push(u);
  });
  if (limpio.length) { USERS.length = 0; limpio.forEach(function(u){ USERS.push(u); }); }
}

// Si el código del usuario conectado cambió, se cierra la sesión
function verificarSesion(){
  if (!USER) return;
  var vigente = USERS.find(function(u){ return u.cod === USER.cod && u.rol === USER.rol; });
  if (vigente) { USER = vigente; return; }
  showToast('🔐 Tu código de acceso cambió — vuelve a ingresar','#EF4444');
  try { logout(); } catch(e) { location.reload(); }
}

function borrarFoto(sid, fid){
  if (!DB.fotosBorradas) DB.fotosBorradas = [];
  if (DB.fotosBorradas.indexOf(fid) < 0) DB.fotosBorradas.push(fid);
  if (DB.fotos && DB.fotos[sid]) DB.fotos[sid] = DB.fotos[sid].filter(function(x){ return x.id !== fid; });
  saveDB();
}
function purgarFotosBorradas(){
  var del = DB.fotosBorradas || [];
  if (!del.length || !DB.fotos) return;
  Object.keys(DB.fotos).forEach(function(k){
    if (Array.isArray(DB.fotos[k])) DB.fotos[k] = DB.fotos[k].filter(function(f){ return del.indexOf(f.id) < 0; });
  });
}

// ═══ AVISOS PARA LOS PAPÁS ═══════════════════════════════
var avisosSilencio = false, avisosTimer = null;
function avisoUnaVez(k, titulo, cuerpo){
  try {
    var lk = 'colibriapp_av_' + (USER ? USER.cod : 'x') + '_' + k;
    if (localStorage.getItem(lk)) return;

function revisarAvisosPapa(){
  if (!USER || USER.rol !== 'papa') return;
  var nino = (DB.ninos || []).find(function(n){ return n.id === USER.nid; });
  if (!nino) return;
  var initKey = 'colibriapp_avinit_' + USER.cod;
  avisosSilencio = !localStorage.getItem(initKey); // primera vez: sólo marcar, sin avisar
  var hoy = fmt(new Date()), nom = String(nino.nom || '').split(' ')[0];
  var mesHoy = mesLbl(new Date().getMonth(), new Date().getFullYear());
  try {
    // 1) Menú de alimentación cargado
    var sem = (DB.menuAlim || {})[fmt(lunesDe(new Date()))] || {};
    var dw = new Date().getDay() - 1;
    if (dw >= 0 && dw <= 4) {
      var d = sem[DIAS_SEM[dw].k] || {};
      var txt = [d.refri1, d.almuerzo, d.refri2].filter(Boolean).join(' · ');
      if (txt) avisoUnaVez('menu-' + hoy + '-' + txt.length, '🍽️ Menú de hoy publicado', txt);
    }
    // 2) Pago registrado
    (DB.historialPagos || []).filter(function(h){ return h.nid === nino.id; }).forEach(function(h){
      avisoUnaVez('pago-' + (h.id || (h.fecha + '-' + h.monto)), '✅ Pago registrado',
        'Se registró tu pago de $' + (h.monto || 0) + (h.concepto ? ' — ' + h.concepto : '') + '.');
    });
    // 3) Pago por vencer / vencido
    var mat = (DB.matriculas || []).find(function(m){ return m.nid === nino.id; });
    if (mat) {
      if (mat.vence) {
        var dv = new Date(String(mat.vence).slice(0,10) + 'T12:00:00');
        var dias = Math.ceil((dv - new Date()) / 86400000);
        if (dias >= 0 && dias <= 5) avisoUnaVez('porvencer-' + mat.vence, '⏰ Tu pago está por vencer', 'Vence el ' + mat.vence + ' · $' + matMonto(mat) + '.');
        if (dias < 0) avisoUnaVez('vencido-' + mat.vence, '🔴 Pago vencido', 'El pago venció el ' + mat.vence + '. Por favor acércate a la administración.');
      }
      if (mat.estado === 'por_vencer') avisoUnaVez('est-porvencer-' + mesHoy, '⏰ Pago por vencer', 'Tu pago de ' + mesHoy + ' está por vencer.');
      if (mat.estado === 'vencido')    avisoUnaVez('est-vencido-' + mesHoy, '🔴 Pago vencido', 'Tienes un pago vencido. Comunícate con la administración.');
    }
    if (!ninoBeca(nino) && !ninoVacas(nino, mesHoy) && !pagoPensionDe(nino.id, mesHoy) && new Date().getDate() >= 20)
      avisoUnaVez('pension-porvencer-' + mesHoy, '⏰ Pensión de ' + mesHoy + ' por vencer', 'Aún no se registra el pago de ' + mesHoy + '.');
    var atras = mesesAtrasados(nino);
    if (atras.length) avisoUnaVez('atraso-' + atras.join('|'), '🔴 Pago vencido', 'Meses pendientes: ' + atras.join(', ') + '.');
    // 4) Asistencia del día (ausente / atraso)
    var estH = nino.asis ? nino.asis[hoy] : null;
    if (estH === 'A') avisoUnaVez('asis-' + hoy + '-A', '❌ Ausencia registrada', nom + ' fue registrado como AUSENTE hoy.');
    if (estH === 'T') avisoUnaVez('asis-' + hoy + '-T', '⏰ Atraso registrado', nom + ' fue registrado con ATRASO hoy.');
    // 5) Fotos del día
    var fts = ((DB.fotos || {})[nino.sid] || []).filter(function(f){ return f.fecha === hoy; });
    if (fts.length) {
      var ult = fts[fts.length - 1];
      avisoUnaVez('foto-' + (ult.id || (hoy + '-' + fts.length)), '📷 Nueva foto del día', ult.desc || 'Ya puedes verla en la galería.');
    }
  } catch(e) {}
  if (avisosSilencio) { try { localStorage.setItem(initKey, '1'); } catch(e) {} avisosSilencio = false; }
}
function iniciarAvisosPapa(){
  if (avisosTimer) clearInterval(avisosTimer);
  setTimeout(revisarAvisosPapa, 1500);
  avisosTimer = setInterval(revisarAvisosPapa, 120000);
}

function tryLogin(){
  const val = document.getElementById('loginInput').value.trim().toUpperCase();
  sanearUsuarios();
  let u = USERS.find(x => x.cod === val);
  // el código debe coincidir con la ficha vigente; los anteriores ya no sirven
  if(u && u.rol==='papa'){
    const n=(DB.ninos||[]).find(x=>x.id===u.nid);
    if(!n || String(n.codp||'').trim().toUpperCase()!==val) u=null;
  }
  if(u && u.rol==='maestra' && u.mid){
    const m=(DB.maestras||[]).find(x=>x.id===u.mid);
    if(m && m.cod && String(m.cod).trim().toUpperCase()!==val) u=null;
  }
  if(u){
    USER = u;
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appPage').classList.remove('hidden');
    startApp();
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('loginInput').style.border = '2px solid #EF4444';
    document.getElementById('loginInput').focus();
  }
}

// ═══ DOM HELPERS ═════════════════════════════════════════
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style' && typeof v==='object') Object.assign(e.style,v);
    else if(k==='cls') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k[0]==='_') e.addEventListener(k.slice(1),v);
    else e[k]=v;
  });
  kids.flat().forEach(k=>{ if(k!=null && k!==false) e.appendChild(typeof k==='string'||typeof k==='number' ? document.createTextNode(String(k)) : k); });
  return e;
}
function div(style,...kids){ return el('div',{style},...kids); }

function comprimirImg(file,maxPx,cb){
  var r=new FileReader();
  r.onload=function(ev){
    var im=new Image();
    im.onload=function(){
      var sc=Math.min(1,maxPx/Math.max(im.width,im.height));
      var c=document.createElement('canvas');
      c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.8));
    };
    im.src=ev.target.result;
  };
  r.readAsDataURL(file);
}

// Toast notification helper
function showToast(msg, color='#7C3AED'){
  const existing=document.getElementById('__toast');
  if(existing)existing.remove();
  const t=el('div',{id:'__toast',style:{position:'fixed',bottom:'28px',left:'50%',transform:'translateX(-50%)',background:color,color:'#fff',padding:'12px 28px',borderRadius:'14px',fontWeight:700,fontSize:'14px',boxShadow:'0 8px 28px rgba(0,0,0,.18)',zIndex:9999,whiteSpace:'nowrap',transition:'opacity .3s'}},msg);
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),400);},2500);
}

      pvBadge.style.background=f.bg; pvBadge.style.color=f.c;
      pvBadge.textContent=f.ico+' '+f.label;
      document.getElementById('pvNom')&&(document.getElementById('pvNom').textContent=f.label||'Nombre del servicio');
    }
    refreshPreview();

    // Emoji / icon
    const emoWrap=el('div',{cls:'fgrp'});
    emoWrap.appendChild(el('label',{cls:'lbl'},'Ícono / Emoji'));
    const emoRow=div({display:'flex',gap:'8px',alignItems:'center'});
    const emoInp=el('input',{cls:'inp',style:{width:'80px',fontSize:'22px',textAlign:'center'}});
    emoInp.value=f.ico;
    emoInp.addEventListener('input',e=>{f.ico=e.target.value.trim()||'📌';refreshPreview();});
    const emoSugg=['🏠','📚','🔢','🇬🇧','🎨','🎵','🏃','🧪','📐','🖥️','🎭','⚽','🧘','🌱'];
    const emoList=div({display:'flex',gap:'6px',flexWrap:'wrap'});
    emoSugg.forEach(em=>{
      const b=el('button',{style:{background:'#F4F1FF',border:'none',borderRadius:'8px',padding:'6px 10px',fontSize:'18px',cursor:'pointer'}},em);
      b.addEventListener('click',()=>{f.ico=em;emoInp.value=em;refreshPreview();});
      emoList.appendChild(b);
    });
    emoRow.appendChild(emoInp);
    emoRow.appendChild(emoList);
    emoWrap.appendChild(emoRow);
    box.appendChild(emoWrap);

    // Label
    const lblW=el('div',{cls:'fgrp'});
    lblW.appendChild(el('label',{cls:'lbl'},'Nombre del servicio'));
    const lblI=el('input',{cls:'inp',placeholder:'Ej: Clases de Inglés'});
    lblI.value=f.label;
    lblI.addEventListener('input',e=>{f.label=e.target.value;refreshPreview();});
    lblW.appendChild(lblI);
    box.appendChild(lblW);

    // ID (for new only)
    if(isNew){
      const idW=el('div',{cls:'fgrp'});
      idW.appendChild(el('label',{cls:'lbl'},'ID interno (sin espacios ni tildes)'));
      const idI=el('input',{cls:'inp',placeholder:'Ej: ingles, arte, futbol'});
      idI.value=f.id;
      idI.addEventListener('input',e=>{f.id=e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,'');idI.value=f.id;});
      idW.appendChild(idI);
      idW.appendChild(p({margin:'4px 0 0',fontSize:'11px',color:'#6B7280'},'Solo letras minúsculas y números. Se usa internamente para identificar el servicio.'));
      box.appendChild(idW);
    }

    // Description
    const dW=el('div',{cls:'fgrp'});
    dW.appendChild(el('label',{cls:'lbl'},'Descripción breve (opcional)'));
    const dI=el('input',{cls:'inp',placeholder:'Ej: Refuerzo de inglés para niños 2-5 años'});
    dI.value=f.desc||'';
    dI.addEventListener('input',e=>{f.desc=e.target.value;});
    dW.appendChild(dI);
    box.appendChild(dW);

    // Color picker
    const cW=el('div',{cls:'fgrp'});
    cW.appendChild(el('label',{cls:'lbl'},'Color del servicio'));
    const cRow=div({display:'flex',gap:'8px',flexWrap:'wrap'});
    COLORES.forEach(col=>{
      const active=f.c===col.c;
      const b=el('button',{style:{width:'36px',height:'36px',borderRadius:'10px',background:col.bg,border:'3px solid '+(active?col.c:'transparent'),cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:700,color:col.c,transition:'all .15s'}},col.nom.charAt(0));
      b.title=col.nom;
      b.addEventListener('click',()=>{
        f.c=col.c; f.bg=col.bg;
        cRow.querySelectorAll('button').forEach(x=>x.style.border='3px solid transparent');
        b.style.border='3px solid '+col.c;
        refreshPreview();
      });
      cRow.appendChild(b);
    });
    cW.appendChild(cRow);
    box.appendChild(cW);

    // Actions
    box.appendChild(div({display:'flex',gap:'10px',marginTop:'18px'},
      btn(isNew?'Crear servicio':'Guardar cambios','btn-pri',()=>{
        if(!f.label){showToast('El nombre es obligatorio','#EF4444');return;}
        if(isNew){
          if(!f.id) f.id=f.label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'_').replace(/__+/g,'_');
          if(DB.servicios.find(s=>s.id===f.id)){showToast('Ya existe un servicio con ese ID','#EF4444');return;}
          DB.servicios.push({...f,activo:true});
          showToast('Servicio "'+f.label+'" creado','#10B981');
        } else {
          Object.assign(existing,f);
          showToast('Servicio actualizado','#10B981');
        }
        saveDB(); bg.remove(); draw();
      }),
      btn('Cancelar','btn-light',()=>bg.remove())
    ));

    bg.appendChild(box);
    document.body.appendChild(bg);
  }

  draw();
}


// ─── Ingreso extraordinario (otros motivos) ──────────────
function addOtroIngreso(mesLabel,redraw){
  let f={fecha:fmt(new Date()),concepto:'',desc:'',monto:0};
  const {close}=modal([
    el('h3',{style:{margin:'0 0 6px',fontWeight:900}},'💵 Ingreso extraordinario'),
    p({margin:'0 0 18px',color:'#6B7280',fontSize:'13px'},'Dinero recibido por otros motivos · se sumará a los ingresos de '+mesLabel),
    fgrp('Concepto',inpEl(f.concepto,'Ej: Donación, venta de uniformes, evento...',v=>f.concepto=v)),
    el('div',{cls:'g2'},
      fgrp('Fecha',inpEl(f.fecha,'',v=>f.fecha=v,'date')),
      fgrp('Monto ($)',inpEl('','',v=>f.monto=Number(v)||0,'number'))
    ),
    fgrp('Descripción del ingreso',txaEl(f.desc,'Describe de dónde proviene este dinero...',v=>f.desc=v,3)),
    div({display:'flex',gap:'10px'},
      btn('Guardar ingreso','btn-grn',()=>{
        if(!f.concepto){showToast('Escribe el concepto','#EF4444');return;}
        if(!f.monto||f.monto<=0){showToast('Ingresa el monto','#EF4444');return;}
        if(!DB.otrosIngresos)DB.otrosIngresos=[];
        DB.otrosIngresos.push({id:uid(),mes:mesLabel,fecha:f.fecha,concepto:f.concepto,desc:f.desc,monto:f.monto});
        saveDB();close();redraw();showToast('✅ Ingreso registrado','#10B981');
      }),
      btn('Cancelar','btn-light',()=>close())
    )
  ],()=>close());
}

// ─── Admin: Balance Mensual ────────────────────────────────
function adminBalance(main){
  const CAT_EGRESO=[
    {id:'nomina',    label:'👩‍🏫 Nómina / Sueldos',   c:'#7C3AED',bg:'#EDE9FE'},
    {id:'servicios', label:'💡 Servicios básicos',      c:'#06B6D4',bg:'#CFFAFE'},
    {id:'alimentacion',label:'🍎 Alimentación/Colación',c:'#10B981',bg:'#D1FAE5'},
    {id:'materiales',label:'✏️ Materiales',             c:'#F59E0B',bg:'#FEF3C7'},
    {id:'caja_chica',label:'💵 Caja chica / Varios',    c:'#EF4444',bg:'#FEE2E2'},
    {id:'otro',      label:'📦 Otro',                   c:'#6B7280',bg:'#F3F4F6'}
  ];
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let mesIdx=new Date().getMonth();
  let anio=new Date().getFullYear();

  function draw(){
    main.innerHTML='';
    if(!DB.egresos) DB.egresos=[];
    const mesLabel=meses[mesIdx]+' '+anio;

    main.appendChild(shdr('Balance Mensual','Cuidado Infantil el Colibrí · '+mesLabel));
    main.appendChild(div({background:'#EDE9FE',borderRadius:'12px',padding:'12px 16px',marginBottom:'16px'},p({margin:0,fontSize:'12px',color:'#5B21B6',fontWeight:600},'💡 Ingresos: pagos de los niños/as (matrícula y pensión) más los ingresos extraordinarios del mes. Egresos: gastos que la administradora registra mes a mes según su criterio.')));

    // Month navigator
    const nav=div({display:'flex',gap:'10px',alignItems:'center',marginBottom:'20px'});
    nav.appendChild(btn('◀','',()=>{mesIdx--;if(mesIdx<0){mesIdx=11;anio--;}draw();},{background:'#E5E7EB',border:'none',borderRadius:'10px',padding:'8px 14px',fontSize:'16px'}));
    nav.appendChild(p({margin:0,fontWeight:800,fontSize:'16px',flex:1,textAlign:'center',color:'#1E1B4B'},mesLabel));
    nav.appendChild(btn('▶','',()=>{mesIdx++;if(mesIdx>11){mesIdx=0;anio++;}draw();},{background:'#E5E7EB',border:'none',borderRadius:'10px',padding:'8px 14px',fontSize:'16px'}));
    nav.appendChild(btn('+ Ingreso','btn-grn',()=>addOtroIngreso(mesLabel,draw)));
    nav.appendChild(btn('+ Egreso','btn-red',()=>addEgreso(mesLabel,draw)));
    nav.appendChild(btn('📄 PDF del mes','btn-pri',()=>genBalancePDF(mesIdx,anio)));
    main.appendChild(nav);

    // Ingresos del mes (from historialPagos)
    const pagsMes=(DB.historialPagos||[]).filter(h=>{ try{const d=new Date(h.fecha);return d.getMonth()===mesIdx&&d.getFullYear()===anio;}catch{return false;} });
    const totalPagos=pagsMes.reduce((s,h)=>s+Number(h.monto||0),0);
    if(!DB.otrosIngresos)DB.otrosIngresos=[];
    const otrosMes=DB.otrosIngresos.filter(o=>o.mes===mesLabel);
    const totalOtros=otrosMes.reduce((s,o)=>s+Number(o.monto||0),0);
    const totalIngreso=totalPagos+totalOtros;
    // Ingresos proyectados (matriculas activas)
    const ingProyectado=DB.matriculas?DB.matriculas.filter(m=>m.estado!=='vencido').reduce((s,m)=>s+matMonto(m),0):0;

    // Egresos del mes
    const egresosMes=(DB.egresos||[]).filter(e=>e.mes===mesLabel);
    const totalEgreso=egresosMes.reduce((s,e)=>s+Number(e.monto||0),0);
    const balance=totalIngreso-totalEgreso;

    // Summary cards
    const sg=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'14px',marginBottom:'18px'}});
    [
      {l:'Ingresos del mes',  v:'$'+totalIngreso,   c:'#10B981',bg:'#D1FAE5',i:'💰',sub:pagsMes.length+' pagos · '+otrosMes.length+' extraordinarios'},
      {l:'Ingreso proyectado',v:'$'+ingProyectado,c:'#06B6D4',bg:'#CFFAFE',i:'📈',sub:'matrículas activas'},
      {l:'Egresos del mes',   v:'$'+totalEgreso,    c:'#EF4444',bg:'#FEE2E2',i:'📤',sub:egresosMes.length+' gastos registrados'},
      {l:'Balance neto',      v:'$'+balance,        c:balance>=0?'#10B981':'#EF4444',bg:balance>=0?'#D1FAE5':'#FEE2E2',i:balance>=0?'✅':'⚠️',sub:'ingresos − egresos'}
    ].forEach(s=>{
      const c=el('div',{cls:'stat-card'});
      c.appendChild(div({display:'flex',justifyContent:'space-between'},
        div(null,
          p({margin:0,fontSize:'11px',fontWeight:700,color:'#6B7280',textTransform:'uppercase'},s.l),
          p({margin:'6px 0 2px',fontSize:'22px',fontWeight:900,color:s.c},s.v),
          p({margin:0,fontSize:'11px',color:'#6B7280'},s.sub)
        ),
        div({width:'40px',height:'40px',borderRadius:'12px',background:s.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px'},s.i)
      ));
      sg.appendChild(c);
    });
    main.appendChild(sg);

    // Egresos por categoría
    const eg=el('div',{cls:'g2'});

    // Left: List of egresos
    const eCard=el('div',{cls:'card'});
    eCard.appendChild(div({display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'},
      el('h3',{style:{margin:0,fontWeight:800}},'📤 Egresos — '+mesLabel),
      btn('+ Agregar','btn-sm btn-red',()=>addEgreso(mesLabel,draw))
    ));
    if(!egresosMes.length){
      eCard.appendChild(p({color:'#6B7280',fontSize:'13px',textAlign:'center',padding:'20px'},'Sin egresos registrados este mes.'));
    }
    // Group by category
    CAT_EGRESO.forEach(cat=>{
      const catEgs=egresosMes.filter(e=>e.categoria===cat.id);
      if(!catEgs.length) return;
      const catTotal=catEgs.reduce((s,e)=>s+Number(e.monto||0),0);
      eCard.appendChild(div({display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 12px',background:cat.bg,borderRadius:'10px',marginBottom:'6px'},
        el('span',{style:{fontWeight:700,color:cat.c,fontSize:'13px'}},cat.label),
        el('span',{style:{fontWeight:900,color:cat.c,fontSize:'14px'}},'$'+catTotal)
      ));
      catEgs.forEach(eg=>{
        const row=div({display:'flex',gap:'10px',alignItems:'center',padding:'8px 12px 8px 20px',borderBottom:'1px solid #F3F4F6'});
        row.appendChild(p({margin:0,fontSize:'12px',color:'#6B7280',width:'85px',flexShrink:0},eg.fecha));
        row.appendChild(p({margin:0,flex:1,fontSize:'13px'},eg.concepto));
        row.appendChild(p({margin:0,fontWeight:800,fontSize:'13px',color:'#EF4444',width:'65px',textAlign:'right'},'$'+eg.monto));
        const db=btn('🗑','',()=>{DB.egresos=DB.egresos.filter(x=>x.id!==eg.id);saveDB();draw();},{background:'#FEE2E2',border:'none',borderRadius:'6px',padding:'4px 8px',fontSize:'12px'});
        row.appendChild(db);
        eCard.appendChild(row);
      });
    });
    // Total egresos
    eCard.appendChild(div({background:'#1E1B4B',borderRadius:'10px',padding:'12px',marginTop:'10px',display:'flex',justifyContent:'space-between',alignItems:'center'},
      p({margin:0,fontWeight:700,color:'rgba(255,255,255,.8)',fontSize:'13px'},'TOTAL EGRESOS'),
      p({margin:0,fontWeight:900,color:'#F59E0B',fontSize:'18px'},'$'+totalEgreso)
    ));
    eg.appendChild(eCard);

    // Right: Ingresos del mes
    const iCard=el('div',{cls:'card'});
    iCard.appendChild(el('h3',{style:{margin:'0 0 14px',fontWeight:800}},'💰 Ingresos cobrados — '+mesLabel));
    if(!pagsMes.length){
      iCard.appendChild(p({color:'#6B7280',fontSize:'13px',textAlign:'center',padding:'20px'},'Sin pagos registrados este mes.'));
    } else {
      pagsMes.slice().reverse().forEach(h=>{
        const nino=DB.ninos.find(n=>n.id===h.nid);
        iCard.appendChild(div({display:'flex',gap:'10px',alignItems:'center',padding:'9px 0',borderBottom:'1px solid #E5E7EB'},
          div({width:'34px',height:'34px',borderRadius:'50%',background:'#D1FAE5',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'17px'},nino?nino.ava:'👶'),
          div({flex:1},
            p({margin:0,fontWeight:700,fontSize:'13px'},nino?nino.nom:'—'),
            p({margin:0,fontSize:'11px',color:'#6B7280'},h.concepto+' · '+h.metodo+' · '+h.fecha)
          ),
          p({margin:0,fontWeight:900,fontSize:'14px',color:'#10B981'},'$'+h.monto)
        ));
      });
    }
    iCard.appendChild(div({background:'#D1FAE5',borderRadius:'10px',padding:'12px',marginTop:'10px',display:'flex',justifyContent:'space-between',alignItems:'center'},
      p({margin:0,fontWeight:700,color:'#059669',fontSize:'13px'},'TOTAL COBRADO'),
      p({margin:0,fontWeight:900,color:'#059669',fontSize:'18px'},'$'+totalIngreso)
    ));
    // Ingresos extraordinarios
    iCard.appendChild(div({display:'flex',justifyContent:'space-between',alignItems:'center',margin:'16px 0 8px'},
      el('h4',{style:{margin:0,fontWeight:800,fontSize:'14px'}},'✨ Ingresos extraordinarios'),
      btn('+ Agregar','btn-sm btn-grn',()=>addOtroIngreso(mesLabel,draw))
    ));
    if(!otrosMes.length){
      iCard.appendChild(p({color:'#6B7280',fontSize:'12px',padding:'4px 0 8px'},'Sin ingresos extraordinarios este mes.'));
    } else {
      otrosMes.forEach(o=>{
        const row=div({display:'flex',gap:'10px',alignItems:'flex-start',padding:'9px 0',borderBottom:'1px solid #E5E7EB'});
        row.appendChild(div({width:'34px',height:'34px',borderRadius:'50%',background:'#FEF3C7',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'17px',flexShrink:'0'},'✨'));
        row.appendChild(div({flex:1},p({margin:0,fontWeight:700,fontSize:'13px'},o.concepto),o.desc?p({margin:'2px 0 0',fontSize:'11px',color:'#6B7280'},o.desc):null,p({margin:'2px 0 0',fontSize:'11px',color:'#9CA3AF'},o.fecha)));
        row.appendChild(p({margin:0,fontWeight:900,fontSize:'14px',color:'#F59E0B'},'$'+o.monto));
        row.appendChild(btn('🗑','',()=>{if(!confirm('¿Eliminar este ingreso?'))return;DB.otrosIngresos=DB.otrosIngresos.filter(x=>x.id!==o.id);saveDB();draw();},{background:'#FEE2E2',border:'none',borderRadius:'6px',padding:'4px 8px',fontSize:'12px'}));
        iCard.appendChild(row);
      });
    }
    iCard.appendChild(div({background:'#1E1B4B',borderRadius:'10px',padding:'12px',marginTop:'10px',display:'flex',justifyContent:'space-between',alignItems:'center'},
      p({margin:0,fontWeight:700,color:'rgba(255,255,255,.8)',fontSize:'13px'},'TOTAL INGRESOS'),
      p({margin:0,fontWeight:900,color:'#10B981',fontSize:'18px'},'$'+totalIngreso)
    ));
    eg.appendChild(iCard);
    main.appendChild(eg);

    // Balance bar
    if(totalIngreso>0||totalEgreso>0){
      const pct=totalIngreso>0?Math.min(Math.round(totalEgreso/totalIngreso*100),100):100;
      const bCard=el('div',{cls:'card'});
      bCard.appendChild(el('h3',{style:{margin:'0 0 12px',fontWeight:800}},'📊 Relación Ingresos vs Egresos'));
      bCard.appendChild(p({margin:'0 0 8px',fontSize:'13px',color:'#6B7280'},'Egresos representan el '+pct+'% de los ingresos del mes'));
      const bar=div({background:'#E5E7EB',borderRadius:'99px',height:'20px',overflow:'hidden'});
      bar.appendChild(div({width:pct+'%',height:'100%',background:pct>90?'#EF4444':pct>70?'#F59E0B':'#10B981',borderRadius:'99px',transition:'width .5s',display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:'8px'},
        el('span',{style:{color:'#fff',fontSize:'11px',fontWeight:700}},pct>10?pct+'%':'')
      ));
      bCard.appendChild(bar);
      bCard.appendChild(div({display:'flex',justifyContent:'space-between',marginTop:'8px'},
        p({margin:0,fontSize:'12px',color:'#10B981',fontWeight:700},'Ingresos: $'+totalIngreso),
        p({margin:0,fontSize:'12px',color:'#EF4444',fontWeight:700},'Egresos: $'+totalEgreso),
        p({margin:0,fontSize:'12px',fontWeight:900,color:balance>=0?'#10B981':'#EF4444'},'Balance: $'+balance)
      ));
      main.appendChild(bCard);
    }
  }

  function addEgreso(mesLabel, redraw){
    const CAT_EGRESO2=[
      {id:'nomina',label:'👩‍🏫 Nómina / Sueldos'},
      {id:'servicios',label:'💡 Servicios básicos (luz, agua, internet)'},
      {id:'alimentacion',label:'🍎 Alimentación / Colación'},
      {id:'materiales',label:'✏️ Materiales y útiles'},
      {id:'caja_chica',label:'💵 Caja chica / Gastos varios'},
      {id:'otro',label:'📦 Otro'}
    ];
    let f={concepto:'',monto:0,categoria:'nomina',fecha:fmt(new Date()),mes:mesLabel};
    const {close}=modal([
      el('h3',{style:{margin:'0 0 6px',fontWeight:900}},'Registrar egreso'),
      p({margin:'0 0 16px',color:'#6B7280',fontSize:'13px'},mesLabel),
      fgrp('Concepto / Descripción',inpEl(f.concepto,'Ej: Sueldo maestra, factura luz...',v=>f.concepto=v)),
      el('div',{cls:'g2'},
        fgrp('Monto ($)',inpEl('','0',v=>f.monto=Number(v)||0,'number')),
        fgrp('Fecha',inpEl(f.fecha,'',v=>f.fecha=v,'date'))
      ),
      fgrp('Categoría',selEl(f.categoria,CAT_EGRESO2.map(c=>[c.id,c.label]),v=>f.categoria=v)),
      div({display:'flex',gap:'10px',marginTop:'6px'},
        btn('Guardar egreso','btn-red',()=>{
          if(!f.concepto||!f.monto){showToast('Ingresa concepto y monto','#EF4444');return;}
          if(!DB.egresos)DB.egresos=[];
          DB.egresos.push({id:uid(),...f});
          saveDB();close();redraw();
          showToast('Egreso registrado: $'+f.monto,'#EF4444');
        }),
        btn('Cancelar','btn-light',()=>close())
      )
    ],()=>close());
  }
  draw();
}

function exportHistorialExcel(){
  const fecha=new Date().toLocaleDateString('es-EC',{day:'numeric',month:'long',year:'numeric'});
  // Sheet 1: Matrículas
  let matRows='';
  DB.ninos.forEach((n,i)=>{
    const sala=DB.salas.find(s=>s.id===n.sid);
    const mat=DB.matriculas?DB.matriculas.find(m=>m.nid===n.id):null;
    const sv=mat?getSvcInfo(mat.servicio):{label:'—'};
    const estMap={vigente:'✅ Vigente',por_vencer:'⏰ Por vencer',vencido:'🔴 Vencido',beca:'🎓 Beca'};
    matRows+='<tr><td>'+(i+1)+'</td><td>'+n.nom+'</td><td>'+(sala?sala.nom:'—')+'</td><td>'+sv.label+'</td><td>'+(mat?estMap[mat.estado]||mat.estado:'—')+'</td><td>$'+(mat?mat.monto||0:0)+'</td><td>'+(mat&&mat.vence?mat.vence:'—')+'</td><td>'+n.tutor+'</td><td>'+n.tel+'</td><td>'+(mat&&mat.obs?mat.obs:'—')+'</td></tr>';
  });
  // Sheet 2: Pagos
  let pagRows='';
  (DB.historialPagos||[]).slice().reverse().forEach(h=>{
    const nino=DB.ninos.find(n=>n.id===h.nid);
    pagRows+='<tr><td>'+h.fecha+'</td><td>'+(nino?nino.nom:'—')+'</td><td>'+h.concepto+'</td><td>'+h.metodo+'</td><td>$'+h.monto+'</td><td>'+(h.obs||'—')+'</td></tr>';
  });
  const totalCob=(DB.historialPagos||[]).reduce((s,h)=>s+Number(h.monto||0),0);
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">

function exportHistorialCSV(){
  let csv='MATRÍCULAS\n';
  csv+='Estudiante,Sala,Servicio,Estado,Monto,Vence,Tutor,Teléfono\n';
  DB.ninos.forEach(n=>{
    const sala=DB.salas.find(s=>s.id===n.sid);
    const mat=DB.matriculas?DB.matriculas.find(m=>m.nid===n.id):null;
    const sv=mat?getSvcInfo(mat.servicio):{label:'—'};
    csv+='"'+n.nom+'","'+(sala?sala.nom:'—')+'","'+sv.label+'","'+(mat?mat.estado:'—')+'","$'+(mat?mat.monto||0:0)+'","'+(mat&&mat.vence?mat.vence:'—')+'","'+n.tutor+'","'+n.tel+'"\n';
  });
  csv+='\nHISTORIAL DE PAGOS\n';
  csv+='Fecha,Estudiante,Concepto,Método,Monto\n';
  (DB.historialPagos||[]).slice().reverse().forEach(h=>{
    const nino=DB.ninos.find(n=>n.id===h.nid);
    csv+=h.fecha+',"'+(nino?nino.nom:'—')+'","'+h.concepto+'",'+h.metodo+',$'+h.monto+'\n';
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='Historial_ColibriApp_'+fmt(new Date())+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  showToast('CSV exportado correctamente','#10B981');
}

function adminHistorial(main){
  let filtroNino='todos', filtroMes='todos';
  function draw(){
    main.innerHTML='';
    const expBtn=div({display:'flex',gap:'8px'});
    expBtn.appendChild(btn('📊 Exportar Excel','btn-sm btn-grn',()=>exportHistorialExcel()));
    expBtn.appendChild(btn('📄 Exportar CSV','btn-sm',()=>exportHistorialCSV(),{background:'#E5E7EB',color:'#1E1B4B',border:'none',borderRadius:'10px'}));
    main.appendChild(shdr('Historial General de Matrículas y Pagos','Todos los registros del sistema',expBtn));

    // Filters
    const fRow=div({display:'flex',gap:'12px',marginBottom:'20px',flexWrap:'wrap',alignItems:'flex-end'});
    const ninoOpts=[['todos','Todos los estudiantes'],...DB.ninos.map(n=>[n.id,n.nom])];
    const mesesUsados=[...new Set((DB.historialPagos||[]).map(h=>{try{const d=new Date(h.fecha);return d.toLocaleString('es-EC',{month:'long',year:'numeric'});}catch{return '';}}).filter(Boolean))];
    const mesOpts=[['todos','Todos los meses'],...mesesUsados.map(m=>[m,m])];
    fRow.appendChild(div({minWidth:'220px'},el('label',{cls:'lbl'},'Filtrar por estudiante'),selEl(filtroNino,ninoOpts,v=>{filtroNino=v;draw();})));
    if(mesesUsados.length>1) fRow.appendChild(div({minWidth:'180px'},el('label',{cls:'lbl'},'Filtrar por mes'),selEl(filtroMes,mesOpts,v=>{filtroMes=v;draw();})));
    main.appendChild(fRow);

    // Matriculas table
    const mCard=el('div',{cls:'card'});
    mCard.appendChild(el('h3',{style:{margin:'0 0 14px',fontWeight:800}},'📋 Estado de matrículas'));
    const thead=div({display:'grid',gridTemplateColumns:'2fr 1.2fr 1fr 0.8fr 1.2fr 1.5fr',background:'#1E1B4B',padding:'10px 16px',borderRadius:'10px 10px 0 0'});
    ['Estudiante','Servicio','Estado','Monto','Vence','Observación'].forEach(h=>thead.appendChild(p({margin:0,fontSize:'11px',fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase'},h)));
    mCard.appendChild(thead);
    const SVCS=getSvcs();
    const ESTS=[{id:'vigente',label:'✅ Vigente',c:'#10B981',bg:'#D1FAE5'},{id:'por_vencer',label:'⏰ Por vencer',c:'#F59E0B',bg:'#FEF3C7'},{id:'vencido',label:'🔴 Vencido',c:'#EF4444',bg:'#FEE2E2'},{id:'beca',label:'🎓 Beca',c:'#8B5CF6',bg:'#EDE9FE'}];
    const mats=(DB.matriculas||[]).filter(m=>(filtroNino==='todos'||m.nid===filtroNino)&&DB.ninos.some(n=>n.id===m.nid));
    if(!mats.length) mCard.appendChild(p({padding:'20px',textAlign:'center',color:'#6B7280',fontSize:'13px'},'Sin matrículas.'));
    mats.forEach((m,i)=>{
      const nino=DB.ninos.find(n=>n.id===m.nid); if(!nino)return;
      const sala=DB.salas.find(s=>s.id===nino.sid);
      const sv=getSvcInfo(m.servicio);
      const es=ESTS.find(s=>s.id===m.estado)||ESTS[0];
      const row=div({display:'grid',gridTemplateColumns:'2fr 1.2fr 1fr 0.8fr 1.2fr 1.5fr',padding:'10px 16px',alignItems:'center',background:i%2===0?'#fff':'#FAFAFA',borderBottom:'1px solid #E5E7EB'});
      row.appendChild(div({display:'flex',gap:'8px',alignItems:'center'},div({fontSize:'18px'},nino.ava),div(null,p({margin:0,fontWeight:700,fontSize:'13px'},nino.nom),p({margin:0,fontSize:'11px',color:'#6B7280'},sala?sala.nom:'—'))));
      row.appendChild(el('span',{style:{background:sv.bg,color:sv.c,borderRadius:'8px',padding:'3px 9px',fontSize:'11px',fontWeight:700}},sv.label));
      row.appendChild(el('span',{style:{background:es.bg,color:es.c,borderRadius:'8px',padding:'3px 9px',fontSize:'11px',fontWeight:700}},es.label));
      row.appendChild(p({margin:0,fontWeight:800,fontSize:'14px',color:'#1E1B4B'},'$'+(m.monto||0)));
      row.appendChild(p({margin:0,fontSize:'12px',color:'#6B7280'},m.vence||'—'));
      row.appendChild(p({margin:0,fontSize:'12px',color:'#6B7280'},m.obs||'—'));
      mCard.appendChild(row);
    });
    const matTotal=mats.reduce((s,m)=>s+Number(m.monto||0),0);
    mCard.appendChild(div({background:'#1E1B4B',padding:'10px 16px',borderRadius:'0 0 10px 10px',display:'flex',justifyContent:'space-between'},
      p({margin:0,color:'rgba(255,255,255,.7)',fontSize:'13px',fontWeight:700},mats.length+' matrículas'),
      p({margin:0,color:'#F59E0B',fontSize:'16px',fontWeight:900},'$'+matTotal+'/mes proyectado')
    ));
    main.appendChild(mCard);

    // Pagos history table
    const pCard=el('div',{cls:'card'});
    pCard.appendChild(el('h3',{style:{margin:'0 0 14px',fontWeight:800}},'💳 Historial de pagos'));
    const hpags=(DB.historialPagos||[]).filter(h=>{
      const ninoOk=filtroNino==='todos'||h.nid===filtroNino;
      const mesOk=filtroMes==='todos'||(()=>{try{const d=new Date(h.fecha);return d.toLocaleString('es-EC',{month:'long',year:'numeric'})===filtroMes;}catch{return false;}})();
      return ninoOk&&mesOk;
    }).slice().reverse();
    const totalHpags=hpags.reduce((s,h)=>s+Number(h.monto||0),0);
    if(!hpags.length){pCard.appendChild(p({color:'#6B7280',fontSize:'13px',textAlign:'center',padding:'20px'},'Sin pagos en este filtro.'));}
    else {
      const ph=div({display:'grid',gridTemplateColumns:'0.8fr 2fr 1fr 0.8fr 1fr',background:'#1E1B4B',padding:'10px 16px',borderRadius:'10px 10px 0 0'});
      ['Fecha','Estudiante','Concepto','Método','Monto'].forEach(h=>ph.appendChild(p({margin:0,fontSize:'11px',fontWeight:700,color:'rgba(255,255,255,.7)',textTransform:'uppercase'},h)));
      pCard.appendChild(ph);
      hpags.forEach((h,i)=>{
        const nino=DB.ninos.find(n=>n.id===h.nid);
        const row=div({display:'grid',gridTemplateColumns:'0.8fr 2fr 1fr 0.8fr 1fr',padding:'9px 16px',alignItems:'center',background:i%2===0?'#fff':'#FAFAFA',borderBottom:'1px solid #E5E7EB'});
        row.appendChild(p({margin:0,fontSize:'12px',color:'#6B7280'},h.fecha));
        row.appendChild(div({display:'flex',gap:'8px',alignItems:'center'},div({fontSize:'16px'},nino?nino.ava:'👶'),p({margin:0,fontWeight:700,fontSize:'13px'},nino?nino.nom:'—')));
        row.appendChild(p({margin:0,fontSize:'12px'},h.concepto));
        row.appendChild(el('span',{style:{background:h.metodo==='beca'?'#EDE9FE':h.metodo==='transferencia'?'#CFFAFE':'#D1FAE5',color:h.metodo==='beca'?'#8B5CF6':h.metodo==='transferencia'?'#06B6D4':'#059669',borderRadius:'8px',padding:'3px 8px',fontSize:'11px',fontWeight:700}},h.metodo));
        row.appendChild(p({margin:0,fontWeight:900,fontSize:'14px',color:h.monto>0?'#10B981':'#8B5CF6'},'$'+h.monto));
        pCard.appendChild(row);
      });
      pCard.appendChild(div({background:'#1E1B4B',padding:'10px 16px',borderRadius:'0 0 10px 10px',display:'flex',justifyContent:'space-between'},
        p({margin:0,color:'rgba(255,255,255,.7)',fontSize:'13px',fontWeight:700},hpags.length+' pagos registrados'),
        p({margin:0,color:'#10B981',fontSize:'16px',fontWeight:900},'$'+totalHpags+' cobrado')
      ));
    }
    main.appendChild(pCard);
  }
  draw();
}


// ─── Admin: Configuración ─────────────────────────────────
function adminConfig(main){
  main.appendChild(shdr('Configuración del Sistema'));
  const cnA=cardNotificaciones(); if(cnA)main.appendChild(cnA);

  // ── Diagnóstico Firebase ────────────────────────
  const diagCard = el('div',{cls:'card',style:{borderLeft:'4px solid #06B6D4',marginBottom:'0'}});
  diagCard.appendChild(el('h3',{style:{margin:'0 0 14px',fontWeight:800,color:'#06B6D4'}},'🔍 Diagnóstico Firebase'));

  // Status actual
  const statusNow = div({display:'flex',gap:'12px',alignItems:'center',marginBottom:'14px'});
  const statusBadge = el('span',{id:'fbStatus',style:{padding:'6px 16px',borderRadius:'99px',fontSize:'13px',fontWeight:700,background:'#F3F4F6',color:'#6B7280'}});
  statusNow.appendChild(p({margin:0,fontWeight:700,fontSize:'13px',flexShrink:0},'Estado actual:'));
  statusNow.appendChild(statusBadge);
  setTimeout(pintarFbStatus,0); // pintar el estado actual en el badge recién creado
  const btnProbar = btn('🔄 Reconectar','btn-sm btn-cyn',function(){
    fbOnline=false; fsDB=null;
    if(fbListener){fbListener();fbListener=null;}
    fbLog.push(new Date().toLocaleTimeString('es-EC')+' — 🔄 Reconexión manual...');
    cargarYConectarFirebase();
    setTimeout(function(){main.innerHTML='';adminConfig(main);},3000);
  });
  statusNow.appendChild(btnProbar);
  diagCard.appendChild(statusNow);

  // Log de eventos
  diagCard.appendChild(el('label',{cls:'lbl'},'Registro de eventos Firebase'));
  const logBox = el('div',{style:{background:'#0F172A',borderRadius:'10px',padding:'14px',fontFamily:'monospace',fontSize:'12px',color:'#94A3B8',maxHeight:'220px',overflowY:'auto',lineHeight:'1.7'}});
  if(!fbLog.length){
    logBox.appendChild(document.createTextNode('Sin eventos aún...'));
  } else {
    fbLog.slice().reverse().forEach(function(line){
      const ln = document.createElement('div');
      ln.style.color = line.includes('✅') ? '#4ADE80'
                     : line.includes('❌') || line.includes('Error') ? '#F87171'
                     : line.includes('⚠️') ? '#FBBF24'
                     : '#94A3B8';
      ln.textContent = line;
      logBox.appendChild(ln);
    });
  }
  diagCard.appendChild(logBox);

  // Botón test save
  const testRow = div({display:'flex',gap:'10px',marginTop:'12px'});
  testRow.appendChild(btn('🧪 Probar guardado en Firebase','btn-sm btn-pri',function(){
    if(!fbOnline||!fsDB){showToast('Firebase no conectado — revisa el log','#EF4444');return;}
    var testDoc = {test:true, fecha:new Date().toISOString(), mensaje:'Prueba desde ColibriApp'};
    fsDB.collection('colibriapp').doc('test_conexion').set(testDoc)
      .then(function(){showToast('✅ Escritura en Firestore OK','#10B981'); fbLog.push(new Date().toLocaleTimeString('es-EC')+' — ✅ Test escritura OK'); setTimeout(function(){main.innerHTML='';adminConfig(main);},500);})
      .catch(function(e){showToast('❌ Error: '+e.code,'#EF4444'); fbLog.push(new Date().toLocaleTimeString('es-EC')+' — ❌ '+e.code+': '+e.message); setTimeout(function(){main.innerHTML='';adminConfig(main);},500);});
  }));
  testRow.appendChild(btn('🗑 Limpiar log','btn-sm',function(){fbLog=[];main.innerHTML='';adminConfig(main);},{background:'#E5E7EB',border:'none',color:'#6B7280',borderRadius:'10px'}));
  diagCard.appendChild(testRow);
  main.appendChild(diagCard);
  
  // Datos institución
  const ic=el('div',{cls:'card'});
  ic.appendChild(el('h3',{style:{margin:'0 0 16px',fontWeight:800}},'🏫 Datos de la institución'));
  ic.appendChild(div({display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px'},
    el('div',{style:{background:'#F4F1FF',borderRadius:'12px',padding:'14px'}},p({margin:0,fontSize:'11px',fontWeight:700,color:'#6B7280',textTransform:'uppercase'},'Nombre'),p({margin:'4px 0 0',fontWeight:700,fontSize:'16px',color:'#7C3AED'},'🐦 Cuidado Infantil el Colibrí')),
    el('div',{style:{background:'#F4F1FF',borderRadius:'12px',padding:'14px'}},p({margin:0,fontSize:'11px',fontWeight:700,color:'#6B7280',textTransform:'uppercase'},'Sistema'),p({margin:'4px 0 0',fontWeight:700,fontSize:'16px',color:'#7C3AED'},'ColibriApp v1.0')),
    el('div',{style:{background:'#F4F1FF',borderRadius:'12px',padding:'14px'}},p({margin:0,fontSize:'11px',fontWeight:700,color:'#6B7280',textTransform:'uppercase'},'Datos guardados'),p({margin:'4px 0 0',fontWeight:700,fontSize:'14px'},DB.ninos.length+' niños · '+DB.maestras.length+' maestras · '+DB.salas.length+' salas')),
    el('div',{style:{background:'#F4F1FF',borderRadius:'12px',padding:'14px'}},p({margin:0,fontSize:'11px',fontWeight:700,color:'#6B7280',textTransform:'uppercase'},'Almacenamiento'),p({margin:'4px 0 0',fontWeight:700,fontSize:'14px'},'Local (navegador)'))
  ));
  main.appendChild(ic);

  // Perfil de la directora (administradora)
  const dd=dirData();
  const dirCard=el('div',{cls:'card'});
  dirCard.appendChild(el('h3',{style:{margin:'0 0 6px',fontWeight:800}},'👩‍💼 Directora del centro'));
  dirCard.appendChild(p({margin:'0 0 16px',color:'#6B7280',fontSize:'13px'},'Datos de la directora (administradora del sistema). Aparecerán en el menú, los reportes y las fichas en PDF.'));
  let dFoto=dd.foto||null;
  // Foto de perfil
  const fPrev=div({width:'72px',height:'72px',borderRadius:'50%',overflow:'hidden',background:'#EDE9FE',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'34px',flexShrink:'0'});
  function pintaDFoto(){fPrev.innerHTML='';if(dFoto){fPrev.appendChild(el('img',{src:dFoto,style:{width:'100%',height:'100%',objectFit:'cover'}}));}else fPrev.appendChild(document.createTextNode('👩‍💼'));}
  pintaDFoto();
  const dFile=el('input',{type:'file',accept:'image/*',style:{display:'none'}});
  dFile.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;comprimirImg(file,260,du=>{dFoto=du;pintaDFoto();});});
  dirCard.appendChild(div({display:'flex',gap:'14px',alignItems:'center',marginBottom:'16px'},fPrev,dFile,
    div(null,btn('📷 Subir foto de perfil','btn-light',()=>dFile.click()),
      dFoto?btn('Quitar foto','',()=>{dFoto=null;pintaDFoto();},{marginLeft:'8px',background:'#FEE2E2',border:'none',borderRadius:'8px',padding:'9px 14px',fontWeight:'700',fontSize:'13px'}):null,
      p({margin:'6px 0 0',fontSize:'11px',color:'#6B7280'},'Se comprime y se sincroniza entre dispositivos.'))
  ));
  const dNom=el('input',{cls:'inp'}); dNom.placeholder='Ej: Lcda. María Fernanda Pérez'; dNom.value=DB.nombreDirectora||'';
  const dTit=el('input',{cls:'inp'}); dTit.placeholder='Ej: Lcda. en Educación Inicial'; dTit.value=dd.titulacion||'';
  const dCor=el('input',{cls:'inp',type:'email'}); dCor.placeholder='correo@ejemplo.com'; dCor.value=dd.correo||'';
  const dTel=el('input',{cls:'inp'}); dTel.placeholder='09xxxxxxxx'; dTel.value=dd.tel||'';
  const dNac=el('input',{cls:'inp',type:'date'}); dNac.value=dd.nac||'';
  function dGrp(lbl,inp){return el('div',null,el('label',{style:{display:'block',fontSize:'12px',fontWeight:'700',color:'#374151',marginBottom:'5px'}},lbl),inp);}
  dirCard.appendChild(dGrp('Nombre completo',dNom));
  dirCard.appendChild(el('div',{cls:'g2',style:{marginTop:'12px'}},dGrp('Titulación / Título académico',dTit),dGrp('Correo electrónico',dCor)));
  dirCard.appendChild(el('div',{cls:'g2',style:{marginTop:'12px'}},dGrp('Teléfono',dTel),dGrp('Fecha de nacimiento',dNac)));
  dirCard.appendChild(div({marginTop:'16px'},btn('Guardar perfil','btn-pri',function(){
    DB.nombreDirectora=dNom.value.trim();
    DB.directora={foto:dFoto,titulacion:dTit.value.trim(),correo:dCor.value.trim(),tel:dTel.value.trim(),nac:dNac.value};
    var au=USERS.find(function(x){return x.rol==='admin';});
    if(au){au.nom=nomDirectora();au.foto=dFoto;}
    if(USER&&USER.rol==='admin'){USER.nom=nomDirectora();USER.foto=dFoto;}
    document.querySelectorAll('[data-user-nom]').forEach(function(n){n.textContent=nomDirectora();});
    saveDB();
    showToast('✅ Perfil de la directora guardado','#10B981');
    refrescarUI();
  })));
  main.appendChild(dirCard);

  // Backup/Restore
  const bc=el('div',{cls:'card'});
  bc.appendChild(el('h3',{style:{margin:'0 0 16px',fontWeight:800}},'💾 Respaldo de datos'));
  bc.appendChild(p({margin:'0 0 14px',color:'#6B7280',fontSize:'13px'},'Exporta todos los datos para respaldarlos o importar en otro dispositivo.'));
  bc.appendChild(div({display:'flex',gap:'12px',flexWrap:'wrap'},
    btn('⬇️ Exportar respaldo (JSON)','btn-pri',()=>{
      const data=JSON.stringify({DB,USERS,fecha:new Date().toISOString(),version:'1.0'},null,2);
      const blob=new Blob([data],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='colibri_backup_'+fmt(new Date())+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);
    }),
    btn('⬆️ Importar respaldo','',()=>{
      const fi=document.createElement('input');fi.type='file';fi.accept='.json';
      fi.addEventListener('change',e=>{
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();r.onload=ev=>{
          try{
            const saved=JSON.parse(ev.target.result);
            if(!saved.DB||!saved.USERS)throw new Error('Archivo inválido');
            if(!confirm('¿Importar estos datos? Se reemplazarán los datos actuales.'))return;
            Object.assign(DB,saved.DB);USERS.length=0;saved.USERS.forEach(u=>USERS.push(u));
            saveDB();alert('Datos importados correctamente. Recargando...');location.reload();
          }catch(err){alert('Error al importar: '+err.message);}
        };r.readAsText(f);
      });fi.click();
    },{background:'#E5E7EB',color:'#1E1B4B',border:'none',borderRadius:'10px',padding:'10px 18px',fontWeight:700,fontSize:'14px',cursor:'pointer'})
  ));
  main.appendChild(bc);

  // Danger zone
  const dc=el('div',{cls:'card',style:{borderLeft:'4px solid #EF4444'}});
  dc.appendChild(el('h3',{style:{margin:'0 0 10px',fontWeight:800,color:'#EF4444'}},'⚠️ Zona de peligro'));
  dc.appendChild(p({margin:'0 0 14px',color:'#6B7280',fontSize:'13px'},'Esta acción eliminará TODOS los datos del sistema. Solo úsala si necesitas reiniciar desde cero.'));
  dc.appendChild(btn('🗑️ Reiniciar todos los datos','btn-red',resetDB));
  main.appendChild(dc);
}

function getAdminNav(){
  return [

// ─── Servicios helper ─────────────────────────────────────
function getSvcs(){ return (DB.servicios||[]).filter(s=>s.activo!==false); }
function getSvcInfo(id){ return getSvcs().find(s=>s.id===id)||(DB.servicios||[]).find(s=>s.id===id)||{id,label:id,ico:'📌',c:'#6B7280',bg:'#F3F4F6'}; }
// Monto fijo a pagar = monto base − % de beca/descuento
function matMonto(m){ const base=Number(m.monto)||0; const d=Number(m.descuento)||0; return Math.round(base*(1-d/100)*100)/100; }

// ─── Año lectivo, meses y estado de niños ─────────────────
const MESES_ES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function anioLectivoActual(){ return DB.anioLectivo||'2026-2027'; }
function siguienteAnioLectivo(al){ const a=parseInt(String(al||anioLectivoActual()).slice(0,4),10)||new Date().getFullYear(); return (a+1)+'-'+(a+2); }
function mesLbl(idx,anio){ return MESES_ES[idx]+' '+anio; }
function mesDesdeFecha(f){ if(!f)return ''; const d=new Date(String(f).slice(0,10)+'T12:00:00'); return isNaN(d.getTime())?'':mesLbl(d.getMonth(),d.getFullYear()); }
function mesDesdeConcepto(c,fechaRef){
  const m=String(c||'').toLowerCase().match(/(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s*(?:de\s*)?(20\d\d)?/);
  if(!m) return '';
  const idx=MESES_ES.findIndex(x=>x.toLowerCase()===m[1]);
  const anio=m[2]?Number(m[2]):(fechaRef?new Date(String(fechaRef).slice(0,10)+'T12:00:00').getFullYear():new Date().getFullYear());
  return mesLbl(idx,anio);
}
// A qué mes corresponde un pago: campo mes > mes escrito en el concepto > mes de la fecha
function hpMes(hp){ return hp.mes || mesDesdeConcepto(hp.concepto,hp.fecha) || mesDesdeFecha(hp.fecha); }
function esPagoPension(hp){ if(hp.tipo) return hp.tipo==='pension'; return !/matr[ií]cula|inscripci[oó]n/i.test(String(hp.concepto||'')); }
function pagoPensionDe(nid,mes){ return (DB.historialPagos||[]).find(h=>h.nid===nid&&esPagoPension(h)&&hpMes(h)===mes); }
const EST_NINO={activo:{lbl:'Activo',ico:'✅',c:'#10B981',bg:'#D1FAE5'},egresado:{lbl:'Egresado',ico:'🎓',c:'#7C3AED',bg:'#EDE9FE'},retirado:{lbl:'Retirado',ico:'🚪',c:'#EF4444',bg:'#FEE2E2'}};
function estadoNino(n){ var e=(n&&n.estado)||'activo'; if(e==='culmino')e='egresado'; return EST_NINO[e]?e:'activo'; }
function ninoActivo(n){ return !!n && estadoNino(n)==='activo'; }
function ninosActivos(sid){ return DB.ninos.filter(n=>ninoActivo(n)&&(!sid||n.sid===sid)); }
function ninoVacas(n,mes){ return ((n&&n.vacas)||[]).indexOf(mes)>=0; }
function ninoBeca(n){ const m=(DB.matriculas||[]).find(x=>x.nid===n.id); return !!m&&(m.estado==='beca'||Number(m.descuento)>=100); }
// Meses anteriores sin pago de pensión (desde la fecha de ingreso, máx. 12 meses atrás)
function mesesAtrasados(n){
  if(!ninoActivo(n)||ninoBeca(n)) return [];
  const res=[], hoy=new Date();
  const ing=n.fechaIngreso?new Date(String(n.fechaIngreso).slice(0,10)+'T12:00:00'):null;
  const lim=(ing&&!isNaN(ing.getTime()))?new Date(ing.getFullYear(),ing.getMonth(),1):new Date(hoy.getFullYear(),hoy.getMonth()-3,1);
  for(let i=1;i<=12;i++){
    const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
    if(d<lim) break;
    const lbl=mesLbl(d.getMonth(),d.getFullYear());
    if(ninoVacas(n,lbl)) continue;
    if(!pagoPensionDe(n.id,lbl)) res.push(lbl);
  }
  return res.reverse();
}

const AMAE={P:{lbl:'Presente',ico:'✅',c:'#10B981',bg:'#D1FAE5',desc:false},T:{lbl:'Atraso',ico:'⏰',c:'#F59E0B',bg:'#FEF3C7',desc:false},PJ:{lbl:'Falta justificada',ico:'📄',c:'#06B6D4',bg:'#CFFAFE',desc:false},F:{lbl:'Falta injustificada',ico:'🔴',c:'#EF4444',bg:'#FEE2E2',desc:true},PM:{lbl:'Permiso médico',ico:'🩺',c:'#8B5CF6',bg:'#EDE9FE',desc:false},V:{lbl:'Vacaciones',ico:'🏖',c:'#0891B2',bg:'#CFFAFE',desc:false}};
function asisMaeMap(){ if(!DB.asisMae||typeof DB.asisMae!=='object')DB.asisMae={}; return DB.asisMae; }
function asisMaeDe(mid,fecha){ const m=asisMaeMap()[mid]; return m?m[fecha]:null; }
function setAsisMae(mid,fecha,est,obs){ const M=asisMaeMap(); if(!M[mid])M[mid]={}; if(!est)delete M[mid][fecha]; else M[mid][fecha]={est,obs:obs||'',reg:new Date().toISOString()}; saveDB(); }
function incidenciasMes(mid,mesIdx,anio){
  const M=asisMaeMap()[mid]||{}, res=[];
  Object.keys(M).forEach(f=>{ const d=new Date(f+'T12:00:00'); if(d.getMonth()===mesIdx&&d.getFullYear()===anio&&M[f].est!=='P')res.push({fecha:f,...M[f]}); });
  return res.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function pagoMaeDe(mid,mes){ return (DB.pagosMae||[]).find(x=>x.mid===mid&&x.mes===mes); }

      ),

      fgrp('Observaciones',txaEl(f.obs||'','',v=>f.obs=v,2)),
      div({background:'#D1FAE5',borderRadius:'12px',padding:'14px',marginBottom:'14px',display:'flex',justifyContent:'space-between',alignItems:'center'},p({margin:0,fontSize:'12px',fontWeight:700,color:'#059669',textTransform:'uppercase'},'Total a pagar'),netoP),
      div({display:'flex',gap:'10px',flexWrap:'wrap'},
        btn('Guardar pago','btn-grn',()=>{
          if(!DB.pagosMae)DB.pagosMae=[];
          calc();
          const reg={id:prev?prev.id:uid(),mid:m.id,maestra:m.nom,mes:mes,base:Number(f.base)||0,desc:Number(f.desc)||0,bonos:Number(f.bonos)||0,neto:f.neto,fecha:f.fecha,metodo:f.metodo,obs:f.obs||'',faltas:faltasDesc};
          if(prev)Object.assign(prev,reg); else DB.pagosMae.push(reg);
          if(!DB.egresos)DB.egresos=[];
          const eid='sueldo-'+reg.id;
          const eg=DB.egresos.find(x=>x.id===eid);
          const egData={id:eid,fecha:f.fecha,concepto:'Sueldo '+m.nom+' — '+mes,categoria:'sueldos',monto:f.neto,obs:f.obs||''};

        }),

        btn('Cancelar','btn-light',()=>close())
      )
    ],()=>close());
    calc();
  }
  draw();
}

  function registrarPago(mat, nino, redraw, mesPre){
    const hoyRP=new Date();
    const opcionesMes=[];
    for(let i=12;i>=-1;i--){const d=new Date(hoyRP.getFullYear(),hoyRP.getMonth()-i,1);opcionesMes.push(mesLbl(d.getMonth(),d.getFullYear()));}
    const mesIni=mesPre||mesLbl(hoyRP.getMonth(),hoyRP.getFullYear());
    if(opcionesMes.indexOf(mesIni)<0)opcionesMes.push(mesIni);
    let f={fecha:fmt(new Date()),monto:matMonto(mat),mes:mesIni,concepto:'Pensión '+mesIni,metodo:'efectivo'};
    const conceptoInp=inpEl(f.concepto,'',v=>f.concepto=v);
    const atrasoNota=p({margin:'0 0 14px',fontSize:'12px',fontWeight:700,color:'#B91C1C',background:'#FEE2E2',borderRadius:'8px',padding:'8px 12px',display:'none'},'⚠️ Pago atrasado: se registrará en '+mesIni+', no en el mes actual.');
    function checkAtraso(){ const mesHoyStr=mesLbl(hoyRP.getMonth(),hoyRP.getFullYear()); const esAtras=opcionesMes.indexOf(f.mes)<opcionesMes.indexOf(mesHoyStr); atrasoNota.style.display=esAtras?'block':'none'; atrasoNota.textContent='⚠️ Pago atrasado: se registrará en '+f.mes+', no en el mes actual.'; }
    checkAtraso();
    const {close}=modal([
      el('h3',{style:{margin:'0 0 6px',fontWeight:900}},'Registrar pago'),
      p({margin:'0 0 14px',color:'#6B7280',fontSize:'13px'},'Estudiante: '+nino.nom),
      fgrp('Mes al que corresponde el pago',selEl(f.mes,opcionesMes.map(m=>[m,m]),v=>{f.mes=v;if(/^Pensión /.test(conceptoInp.value)||!conceptoInp.value.trim()){f.concepto='Pensión '+v;conceptoInp.value=f.concepto;}checkAtraso();})),
      atrasoNota,
      fgrp('Concepto',conceptoInp),
      el('div',{cls:'g2'},
        fgrp('Fecha en que se recibe',inpEl(f.fecha,'',v=>f.fecha=v,'date')),
        fgrp('Monto ($)',inpEl(f.monto+'','',v=>f.monto=Number(v)||0,'number'))
      ),
      fgrp('Método de pago',selEl(f.metodo,[
        ['efectivo','💵 Efectivo'],
        ['transferencia','🏦 Transferencia'],
        ['deposito','🏧 Depósito'],
        ['beca','🎓 Beca (sin cobro)']
      ],v=>f.metodo=v)),
      fgrp('Observaciones',txaEl('','',v=>f.obs=v,2)),
      div({display:'flex',gap:'10px',marginTop:'6px'},
        btn('Guardar pago','btn-grn',()=>{
          if(!DB.historialPagos) DB.historialPagos=[];
          if(pagoPensionDe(nino.id,f.mes)&&!confirm('Ya existe un pago de pensión de '+nino.nom.split(' ')[0]+' para '+f.mes+'. ¿Registrar otro de todas formas?'))return;
          DB.historialPagos.push({id:uid(),nid:nino.id,fecha:f.fecha,monto:f.monto,concepto:f.concepto,metodo:f.metodo,obs:f.obs||'',mes:f.mes,tipo:'pension'});
          mat.estado='vigente';
          saveDB(); close(); redraw();
          showToast('Pago registrado: $'+f.monto+' — '+f.mes+' · '+nino.nom,'#10B981');
        }),
        btn('Cancelar','btn-light',()=>close())
      )
    ],()=>close());
  }

  function editarPago(hp, redraw){
    const nino=DB.ninos.find(n=>n.id===hp.nid);
    const hoyEP=new Date();
    const opcionesMesE=[];
    for(let i=14;i>=-1;i--){const d=new Date(hoyEP.getFullYear(),hoyEP.getMonth()-i,1);opcionesMesE.push(mesLbl(d.getMonth(),d.getFullYear()));}
    const mesAct=hpMes(hp);
    if(mesAct&&opcionesMesE.indexOf(mesAct)<0)opcionesMesE.unshift(mesAct);
    let f={fecha:hp.fecha,monto:hp.monto,concepto:hp.concepto,metodo:hp.metodo,obs:hp.obs||'',mes:mesAct||opcionesMesE[opcionesMesE.length-2]};
    const {close}=modal([
      el('h3',{style:{margin:'0 0 6px',fontWeight:900}},'✏️ Editar pago'),
      p({margin:'0 0 18px',color:'#6B7280',fontSize:'13px'},'Estudiante: '+(nino?nino.nom:'—')),
      fgrp('Mes al que corresponde',selEl(f.mes,opcionesMesE.map(m=>[m,m]),v=>f.mes=v)),
      fgrp('Concepto',inpEl(f.concepto,'',v=>f.concepto=v)),
      el('div',{cls:'g2'},
        fgrp('Fecha',inpEl(f.fecha,'',v=>f.fecha=v,'date')),
        fgrp('Monto ($)',inpEl(f.monto+'','',v=>f.monto=Number(v)||0,'number'))
      ),
      fgrp('Método de pago',selEl(f.metodo,[['efectivo','💵 Efectivo'],['transferencia','🏦 Transferencia'],['deposito','🏧 Depósito'],['beca','🎓 Beca (sin cobro)']],v=>f.metodo=v)),
      fgrp('Observaciones',txaEl(f.obs,'',v=>f.obs=v,2)),
      div({display:'flex',gap:'10px',marginTop:'6px'},
        btn('Guardar cambios','btn-grn',()=>{Object.assign(hp,{fecha:f.fecha,monto:f.monto,concepto:f.concepto,metodo:f.metodo,obs:f.obs,mes:f.mes});saveDB();close();redraw();showToast('Pago actualizado','#10B981');}),
        btn('🗑 Eliminar','btn-light-red',()=>{if(!confirm('¿Eliminar este pago del historial?'))return;DB.historialPagos=DB.historialPagos.filter(x=>x.id!==hp.id);saveDB();close();redraw();showToast('Pago eliminado','#EF4444');}),
        btn('Cancelar','btn-light',()=>close())
      )
    ],()=>close());
  }

  function verHistorial(nino){
    const historial=(DB.historialPagos||[]).filter(h=>h.nid===nino.id).reverse();
    const total=historial.reduce((s,h)=>s+Number(h.monto||0),0);
    const rows=historial.map(h=>
      div({display:'flex',gap:'12px',alignItems:'center',padding:'10px 0',borderBottom:'1px solid #E5E7EB'},
        p({margin:0,fontSize:'12px',color:'#6B7280',width:'90px',flexShrink:0},h.fecha),
        div({flex:1},p({margin:0,fontWeight:700,fontSize:'13px'},h.concepto),p({margin:0,fontSize:'11px',color:'#6B7280'},h.metodo)),
        p({margin:0,fontWeight:900,fontSize:'14px',color:'#10B981'},'$'+h.monto),
        btn('✏️','',()=>{close();editarPago(h,()=>verHistorial(nino));},{background:'#EDE9FE',color:'#7C3AED',border:'none',borderRadius:'8px',padding:'5px 9px',fontSize:'12px'})
      )
    );
    const {close}=modal([
      el('h3',{style:{margin:'0 0 4px',fontWeight:900}},'Historial de pagos'),
      p({margin:'0 0 16px',color:'#6B7280',fontSize:'13px'},nino.nom),
      !historial.length?p({color:'#6B7280',fontSize:'13px',textAlign:'center',padding:'20px'},'Sin pagos registrados aún.'):el('div',null,...rows),
      historial.length?div({background:'#D1FAE5',borderRadius:'10px',padding:'12px',marginTop:'12px',display:'flex',justifyContent:'space-between',alignItems:'center'},
        p({margin:0,fontWeight:700,color:'#059669'},'Total cobrado:'),
        p({margin:0,fontWeight:900,fontSize:'18px',color:'#059669'},'$'+total)
      ):null,
      div({marginTop:'16px'},btn('Cerrar','btn-light',()=>close()))
    ],()=>close());
  }

  draw();
}

const DIAS_SEM=[{k:'lunes',lbl:'Lunes'},{k:'martes',lbl:'Martes'},{k:'miercoles',lbl:'Miércoles'},{k:'jueves',lbl:'Jueves'},{k:'viernes',lbl:'Viernes'}];
function menuMap(){ if(!DB.menuAlim||typeof DB.menuAlim!=='object')DB.menuAlim={}; return DB.menuAlim; }
function lunesDe(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const dw=x.getDay(); x.setDate(x.getDate()-((dw+6)%7)); return x; }
function semKey(lun){ return fmt(lun); }
function menuSemana(sk){ const M=menuMap(); if(!M[sk])M[sk]={}; return M[sk]; }
function fechaDeDia(lun,i){ const d=new Date(lun.getFullYear(),lun.getMonth(),lun.getDate()+i); return d; }
function semanaLbl(lun){ const v=fechaDeDia(lun,4); const mesL=lun.getMonth()===v.getMonth(); return lun.getDate()+(mesL?'':' '+MESES_ES[lun.getMonth()])+' al '+v.getDate()+' de '+MESES_ES[v.getMonth()]+' '+v.getFullYear(); }

function adminMenu(main){
  let lun=lunesDe(new Date());
  function draw(){
    main.innerHTML='';
    const sk=semKey(lun), sem=menuSemana(sk), esActual=sk===semKey(lunesDe(new Date()));
    const hdrBtns=div({display:'flex',gap:'8px',flexWrap:'wrap'});
    hdrBtns.appendChild(btn('🖨 Imprimir menú','btn-light',()=>genMenuSemanal(lun)));
    hdrBtns.appendChild(btn('📋 Copiar semana anterior','btn-cyn',()=>{
      const prev=menuMap()[semKey(new Date(lun.getFullYear(),lun.getMonth(),lun.getDate()-7))];
      if(!prev||!Object.keys(prev).length){showToast('La semana anterior no tiene menú registrado','#F59E0B');return;}
      if(!confirm('Se copiará el menú de la semana anterior sobre esta semana. ¿Continuar?'))return;
      menuMap()[sk]=JSON.parse(JSON.stringify(prev));saveDB();draw();showToast('Menú copiado','#10B981');
    }));
    main.appendChild(shdr('Menú de alimentación','Lo que verán los papás cada día · semana del '+semanaLbl(lun),hdrBtns));
    const nav=div({display:'flex',gap:'10px',alignItems:'center',justifyContent:'center',flexWrap:'wrap',marginBottom:'16px'});
    nav.appendChild(btn('◀ Semana anterior','btn-light',()=>{lun=new Date(lun.getFullYear(),lun.getMonth(),lun.getDate()-7);draw();}));
    nav.appendChild(el('span',{style:{fontWeight:900,fontSize:'14px',color:'#1E1B4B',padding:'0 6px'}},esActual?'📆 Semana actual':semanaLbl(lun)));
    nav.appendChild(btn('Semana siguiente ▶','btn-light',()=>{lun=new Date(lun.getFullYear(),lun.getMonth(),lun.getDate()+7);draw();}));
    if(!esActual) nav.appendChild(btn('Ir a la semana actual','btn-sm btn-cyn',()=>{lun=lunesDe(new Date());draw();}));
    main.appendChild(nav);
    const hoyF=fmt(HOY);
    DIAS_SEM.forEach((d,i)=>{
      const f=fechaDeDia(lun,i), esHoy=fmt(f)===hoyF;
      if(!sem[d.k])sem[d.k]={};
      const c=el('div',{cls:'card',style:{marginBottom:'14px',border:esHoy?'2px solid #7C3AED':'1px solid #E5E7EB'}});
      c.appendChild(div({display:'flex',gap:'10px',alignItems:'center',marginBottom:'12px',flexWrap:'wrap'},
        el('h3',{style:{margin:0,fontWeight:900,fontSize:'15px',color:'#1E1B4B'}},d.lbl+' '+f.getDate()+' de '+MESES_ES[f.getMonth()]),
        esHoy?badge('Hoy','#7C3AED'):null
      ));
      const g=el('div',{cls:'g3'});
      COMIDAS.forEach(cm=>{
        const w=div({background:cm.bg,borderRadius:'12px',padding:'12px'});
        w.appendChild(p({margin:'0 0 7px',fontSize:'11px',fontWeight:800,color:cm.c,textTransform:'uppercase'},cm.ico+' '+cm.lbl));
        const ta=txaEl(sem[d.k][cm.k]||'','Ej: '+(cm.k==='almuerzo'?'Sopa de quinua, pollo al horno con arroz, jugo de mora':'Fruta picada y galletas integrales'),v=>{sem[d.k][cm.k]=v;saveDB();},3);
        ta.style.background='#fff';
        w.appendChild(ta);
        g.appendChild(w);
      });
      c.appendChild(g);
      const nw=div({marginTop:'10px'});
      nw.appendChild(p({margin:'0 0 6px',fontSize:'11px',fontWeight:800,color:'#6B7280',textTransform:'uppercase'},'📌 Nota para las familias (opcional)'));
      nw.appendChild(inpEl(sem[d.k].nota||'','Ej: hoy traer fruta adicional para la actividad',v=>{sem[d.k].nota=v;saveDB();}));
      c.appendChild(nw);
      main.appendChild(c);
    });
    main.appendChild(div({background:'#D1FAE5',borderRadius:'12px',padding:'13px 16px'},p({margin:0,fontSize:'12px',color:'#059669',fontWeight:600},'✅ Los cambios se guardan automáticamente y los papás los ven al instante en “Menú del día”.')));
  }
  draw();
}

function papaMenu(main,nino,sala){
  let lun=lunesDe(new Date());
  function draw(){
    main.innerHTML='';
    const sk=semKey(lun), sem=menuMap()[sk]||{}, esActual=sk===semKey(lunesDe(new Date()));
    main.appendChild(shdr('Menú de alimentación','Lo que come '+(nino?nino.nom.split(' ')[0]:'tu niño/a')+' cada día · '+semanaLbl(lun)));
    const hoyF=fmt(HOY), diaHoy=new Date().getDay()-1;
    if(esActual&&diaHoy>=0&&diaHoy<=4){
      const dh=DIAS_SEM[diaHoy], dat=sem[dh.k]||{};
      const hc=el('div',{cls:'card',style:{background:'linear-gradient(135deg,#EDE9FE,#CFFAFE)',marginBottom:'18px'}});
      hc.appendChild(p({margin:'0 0 12px',fontWeight:900,fontSize:'17px',color:'#1E1B4B'},'🍽️ Hoy '+dh.lbl.toLowerCase()+' · '+new Date().getDate()+' de '+MESES_ES[new Date().getMonth()]));
      const anyH=COMIDAS.some(cm=>(dat[cm.k]||'').trim());
      if(!anyH) hc.appendChild(p({margin:0,fontSize:'13px',color:'#6B7280'},'El menú de hoy aún no ha sido publicado.'));
      COMIDAS.forEach(cm=>{ const v=(dat[cm.k]||'').trim(); if(!v)return;
        hc.appendChild(div({background:'#fff',borderRadius:'12px',padding:'13px',marginBottom:'9px'},p({margin:'0 0 4px',fontSize:'11px',fontWeight:800,color:cm.c,textTransform:'uppercase'},cm.ico+' '+cm.lbl),p({margin:0,fontSize:'14px',fontWeight:600,color:'#1E1B4B'},v)));
      });
      if(dat.nota) hc.appendChild(div({background:'#FEF3C7',borderRadius:'10px',padding:'11px'},p({margin:0,fontSize:'12px',color:'#92400E',fontWeight:600},'📌 '+dat.nota)));
      main.appendChild(hc);
    }
    const nav=div({display:'flex',gap:'10px',alignItems:'center',justifyContent:'center',flexWrap:'wrap',marginBottom:'16px'});
    nav.appendChild(btn('◀ Anterior','btn-light',()=>{lun=new Date(lun.getFullYear(),lun.getMonth(),lun.getDate()-7);draw();}));
    nav.appendChild(el('span',{style:{fontWeight:800,fontSize:'13px',color:'#6B7280'}},esActual?'Esta semana':semanaLbl(lun)));
    nav.appendChild(btn('Siguiente ▶','btn-light',()=>{lun=new Date(lun.getFullYear(),lun.getMonth(),lun.getDate()+7);draw();}));
    main.appendChild(nav);
    let vacio=true;
    DIAS_SEM.forEach((d,i)=>{
      const f=fechaDeDia(lun,i), dat=sem[d.k]||{}, esHoy=fmt(f)===hoyF;
      const tiene=COMIDAS.some(cm=>(dat[cm.k]||'').trim());
      if(tiene)vacio=false;
      const c=el('div',{cls:'card',style:{marginBottom:'12px',border:esHoy?'2px solid #7C3AED':'1px solid #E5E7EB',opacity:tiene?1:.6}});
      c.appendChild(div({display:'flex',gap:'9px',alignItems:'center',marginBottom:tiene?'11px':'0',flexWrap:'wrap'},
        el('h3',{style:{margin:0,fontWeight:800,fontSize:'14px',color:'#1E1B4B'}},d.lbl+' '+f.getDate()),
        esHoy?badge('Hoy','#7C3AED'):null,
        tiene?null:el('span',{style:{fontSize:'12px',color:'#9CA3AF'}},'Sin menú publicado')
      ));
      if(tiene){
        const g=el('div',{cls:'g3'});
        COMIDAS.forEach(cm=>{ const v=(dat[cm.k]||'').trim();
          g.appendChild(div({background:v?cm.bg:'#F9FAFB',borderRadius:'12px',padding:'12px'},p({margin:'0 0 5px',fontSize:'10.5px',fontWeight:800,color:v?cm.c:'#9CA3AF',textTransform:'uppercase'},cm.ico+' '+cm.lbl),p({margin:0,fontSize:'13px',fontWeight:600,color:v?'#1E1B4B':'#9CA3AF'},v||'—')));
        });
        c.appendChild(g);
        if(dat.nota) c.appendChild(div({background:'#FEF3C7',borderRadius:'10px',padding:'10px',marginTop:'9px'},p({margin:0,fontSize:'12px',color:'#92400E',fontWeight:600},'📌 '+dat.nota)));
      }
      main.appendChild(c);
    });
    if(vacio) main.appendChild(div({background:'#F4F1FF',borderRadius:'14px',padding:'28px',textAlign:'center',color:'#6B7280'},p({fontSize:'34px',marginBottom:'8px'},'🍽️'),p({fontSize:'13px'},'El menú de esta semana aún no ha sido publicado por el centro.')));
    if(nino&&nino.alerg&&nino.alerg!=='Ninguna') main.appendChild(div({background:'#FEE2E2',borderRadius:'12px',padding:'13px 16px',marginTop:'6px'},p({margin:0,fontSize:'12px',color:'#B91C1C',fontWeight:700},'⚠️ Alergias registradas de '+nino.nom.split(' ')[0]+': '+nino.alerg+' — el centro considera esta información en su alimentación.')));
  }
  draw();
}

function genMenuSemanal(lun){
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  var sem=menuMap()[semKey(lun)]||{};
  var head=DIAS_SEM.map(function(d,i){var f=fechaDeDia(lun,i);return '<th>'+d.lbl+'<br><span style="font-weight:normal;font-size:8pt">'+f.getDate()+' '+MESES_ES[f.getMonth()].slice(0,3)+'</span></th>';}).join('');
  var rows=COMIDAS.map(function(cm){
    return '<tr><th style="width:16%;text-align:left">'+cm.ico+' '+esc(cm.lbl)+'</th>'+DIAS_SEM.map(function(d){return '<td>'+esc(((sem[d.k]||{})[cm.k]||'—'))+'</td>';}).join('')+'</tr>';
  }).join('');
  var notas=DIAS_SEM.some(function(d){return (sem[d.k]||{}).nota;})?'<tr><th style="text-align:left">📌 Notas</th>'+DIAS_SEM.map(function(d){return '<td>'+esc((sem[d.k]||{}).nota||'—')+'</td>';}).join('')+'</tr>':'';
  var html='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Menú semanal — '+esc(semanaLbl(lun))+'</title><style>'+
    '*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;font-size:10pt;color:#111;padding:26px;max-width:1100px;margin:0 auto}'+
    '.cab{display:flex;gap:14px;align-items:center;margin-bottom:14px}.cab img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:2px solid #7C3AED}'+
    'h1{font-size:15pt;text-transform:uppercase}h2{font-size:10.5pt;font-weight:normal;color:#444;margin-top:3px}'+
    'table{width:100%;border-collapse:collapse}td,th{border:1px solid #333;padding:8px 9px;font-size:9.5pt;vertical-align:top;text-align:left}'+
    'th{background:#E8E4F8;text-align:center}'+
    '.noprint{margin:14px 0;text-align:center}@media print{.noprint{display:none}body{padding:0}}@page{size:A4 landscape;margin:14mm}'+
    '</style></head><body>'+
    '<div class="cab"><img src="'+LOGO_SRC+'" alt=""><div><h1>Menú de alimentación semanal</h1>'+
    '<h2>Centro de Educación Inicial y Apoyo Psicológico “el Colibrí” · Semana del '+esc(semanaLbl(lun))+'</h2></div></div>'+
    '<table><tr><th></th>'+head+'</tr>'+rows+notas+'</table>'+
    '<div class="noprint"><button onclick="window.print()" style="padding:8px 22px;font-size:11pt;cursor:pointer">🖨 Imprimir / Guardar PDF</button></div>'+
    '</body></html>';
  window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})),'_blank');
}

function adminComunicados(main){
  function draw(){
    main.innerHTML='';
